name: Software license policy checks

on:
  push:
    branches:
      - feature/software-license-commerce-20261025
    paths:
      - 'site/app/licenses/software_license_policy.php'
      - 'tests/software_license_policy.php'
      - '.github/workflows/software-license-policy.yml'
      - 'site/app/billing/authorize_net_*.php'
      - 'site/app/billing/software_subscriptions.php'
      - 'site/app/licenses/software_*.php'
      - 'site/database/schema/software_commerce_schema.php'
      - 'site/database/migrations/software_commerce_migrate.php'
      - 'tests/software_commerce_contract.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l site/app/licenses/software_license_policy.php
          php -l tests/software_license_policy.php
          php -l tests/software_commerce_contract.php
          php -l site/app/licenses/software_grants.php
          php -l site/app/licenses/software_usage.php
          php -l site/app/billing/authorize_net_contract.php
          php -l site/app/billing/authorize_net_webhooks.php
          php -l site/app/billing/authorize_net_client.php
          php -l site/database/schema/software_commerce_schema.php
          php -l site/database/migrations/software_commerce_migrate.php
      - name: Run pure license contract checks
        run: |
          php tests/software_license_policy.php
          php tests/software_commerce_contract.php
