name: Software license policy checks

on:
  push:
    branches:
      - feature/software-license-commerce-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l site/app/licenses/software_license_policy.php
          php -l tests/software_license_policy.php
          php -l tests/software_commerce_contract.php
          php -l tests/software_production_gate_contract.php
          php -l site/app/licenses/software_grants.php
          php -l site/app/licenses/software_products.php
          php -l site/app/licenses/software_asset_access.php
          php -l site/app/billing/software_payment_review.php
          php -l site/app/billing/catalog.php
          php -l site/app/billing/software_charge_guard.php
          php -l site/app/billing/software_charge.php
          php -l site/app/licenses/software_usage.php
          php -l site/app/billing/authorize_net_contract.php
          php -l site/app/billing/authorize_net_webhooks.php
          php -l site/app/billing/authorize_net_client.php
          php -l site/database/schema/software_commerce_schema.php
          php -l site/database/migrations/software_commerce_migrate.php
          php -l site/app/billing/software_orders.php
          php -l site/app/licenses/software_fulfill.php
          php -l site/app/licenses/software_notices.php
          php -l site/portal/views/software.php
          php -l site/api/software-download.php
          php -l site/api/software-webhook.php
          php -l site/app/billing/software_subscription_enroll.php
          php -l site/app/billing/software_subscription_settle.php
          php -l site/app/billing/software_subscriptions.php
          php -l site/app/billing/software_subscription_cancel.php
          php -l site/app/licenses/software_assets.php
          php -l site/api/handlers/license.php
          php -l site/app/licenses/fulfill.php
          php -l site/portal/controllers/router.php
          php -l site/portal/controllers/actions.php
          php -l site/portal/views/workspace.php
          php -l site/admin/controllers/studio.php
          php -l site/admin/views/studio/licenses.php
      - name: Keep real-sandbox acceptance source sandbox-only
        run: |
          python3 -m py_compile tests/software_anet_sandbox_acceptance.py
          ! grep -F 'https://api.authorize.net' tests/software_anet_sandbox_acceptance.py
          ! grep -F 'https://js.authorize.net' tests/software_anet_sandbox_acceptance.py
          grep -F 'https://apitest.authorize.net/xml/v1/request.api' tests/software_anet_sandbox_acceptance.py
          grep -F 'https://jstest.authorize.net/v1/Accept.js' tests/software_anet_sandbox_acceptance.py
      - name: Run pure license contract checks
        run: |
          php tests/software_license_policy.php
          php tests/software_commerce_contract.php
          php tests/software_production_gate_contract.php
