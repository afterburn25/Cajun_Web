name: Native assigned-package WordPress installation checks
on:
  push:
    branches: [main, codex/twentyi-wordpress-installed]
    paths: ['site/app/providers/**', 'site/admin/**', 'foundation/twentyi-inventory/**', 'foundation/twentyi-inventory-reader/**', 'tests/twentyi-inventory-reader/**', 'foundation/twentyi/**', 'site/database/**', 'site/includes/layout/provider_services.php', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'foundation/twentyi-directory-listing/**', 'site/includes/foundation/twentyi-directory-listing/**', 'tests/directory_listing_contract.php', 'tests/directory_listing_transport.php', 'tests/provider_directory_listing_native.php', 'tests/provider_directory_listing_cases.py', 'foundation/twentyi-package-wordpress-installed/**', 'site/includes/foundation/twentyi-package-wordpress-installed/**', 'tests/twentyi-package-wordpress-installed/**', 'tests/provider_package_wordpress_installed_native.php', 'tests/provider_package_wordpress_installed_cases.py', 'tests/provider_wordpress_installed_http_contract.py', 'tests/provider_http_server.py', '.github/workflows/provider-package-wordpress-installed.yml']
  pull_request:
    paths: ['site/app/providers/**', 'site/admin/**', 'foundation/twentyi-inventory/**', 'foundation/twentyi-inventory-reader/**', 'tests/twentyi-inventory-reader/**', 'foundation/twentyi/**', 'site/database/**', 'site/includes/layout/provider_services.php', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'foundation/twentyi-directory-listing/**', 'site/includes/foundation/twentyi-directory-listing/**', 'tests/directory_listing_contract.php', 'tests/directory_listing_transport.php', 'tests/provider_directory_listing_native.php', 'tests/provider_directory_listing_cases.py', 'foundation/twentyi-package-wordpress-installed/**', 'site/includes/foundation/twentyi-package-wordpress-installed/**', 'tests/twentyi-package-wordpress-installed/**', 'tests/provider_package_wordpress_installed_native.php', 'tests/provider_package_wordpress_installed_cases.py', 'tests/provider_wordpress_installed_http_contract.py', 'tests/provider_http_server.py', '.github/workflows/provider-package-wordpress-installed.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordpress-installed-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-history:
    name: Assigned package WordPress installation ${{ matrix.php }} and ${{ matrix.database.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify generated deployment inventory and documentation
        run: |
          PYTHONPATH=tools python -B -c 'import build; build.generated(False)'
          python -B tools/check_docs.py
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-inventory-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Native WordPress installation sharing and retained reader recovery tests
        run: |
          mkdir -p qa
          python -B tests/provider_wordpress_installed_http_contract.py > qa/wordpress-installed-http-handler-results.json
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-inventory-test sh -ec '
              for source in site/app/providers/*.php site/database/schema/provider_directory_listing_schema.php site/admin/views/provider_directory_listing.php site/admin/controllers/providers.php tests/provider_directory_listing_native.php site/database/schema/provider_package_wordpress_installed_schema.php site/admin/controllers/provider_package_wordpress_installed.php site/admin/views/provider_package_wordpress_installed.php site/portal/controllers/package_wordpress_installed.php site/portal/views/package_wordpress_installed.php tests/provider_package_wordpress_installed_native.php; do php -l "$source"; done
              php tests/twentyi-package-wordpress-installed/run.php > qa/package-wordpress-installed-pure-results.json
              php -n tests/twentyi-package-wordpress-installed/run.php > qa/package-wordpress-installed-pure-no-ini-results.json
              php tests/provider_package_wordpress_installed_native.php
              php tests/directory_listing_contract.php > qa/directory-listing-document-results.json
              php -n tests/directory_listing_contract.php > qa/directory-listing-document-no-ini-results.json
              php tests/directory_listing_transport.php > qa/directory-listing-transport-results.json
              php -n tests/directory_listing_transport.php > qa/directory-listing-transport-no-ini-results.json
              php tests/provider_directory_listing_native.php
              php tests/provider_package_force_ssl_native.php
              php tests/provider_document_roots_native.php
              php tests/provider_package_php_native.php
              php tests/domain_expiry_native.php
              php tests/provider_schedule_native.php
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-installed-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: |
            qa/package-wordpress-installed-pure-results.json
            qa/package-wordpress-installed-pure-no-ini-results.json
            qa/provider-package-wordpress-installed-native-results.json
            qa/wordpress-installed-http-handler-results.json
            qa/provider-document-roots-native-results.json
            qa/provider-directory-listing-native-results.json
            qa/provider-package-force-ssl-native-results.json
            qa/directory-listing-transport-results.json
            qa/directory-listing-transport-no-ini-results.json
            qa/directory-listing-document-results.json
            qa/directory-listing-document-no-ini-results.json
            qa/provider-package-php-native-results.json
            qa/domain-expiry-native-results.json
            qa/provider-schedule-native-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verification scope
        if: always()
        run: |
          echo 'Exact assigned-package WordPress installation reported-boolean read, current explicit package assignment, credential-bound observation, independent owner-approved sharing, revocation, retained-history recovery and actual PHP forms. False and unavailable remain distinct; no version, health or definitive absence assertion. Disposable MariaDB/MySQL and synthetic provider only; no real API, browser or deployment.' >> "$GITHUB_STEP_SUMMARY"
