name: Native support-ticket storage checks
on:
  push:
    branches: [main, codex/support-ticket-storage, codex/support-ticket-screens]
    paths: ['site/app/support/**', 'site/database/**', 'site/app/staff/**', 'site/app/clients/**', 'site/includes/auth/**', 'foundation/access/**', 'site/includes/foundation/access/**', 'foundation/desk/**', 'site/includes/foundation/desk/**', 'tests/support_tickets_native.php', 'tests/support_ticket_screen_native_cases.php', 'site/includes/layout/ticket*.php', 'site/admin/controllers/tickets.php', 'site/admin/views/tickets.php', 'site/portal/controllers/tickets.php', 'site/portal/views/tickets.php', '.github/workflows/support-tickets.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-tickets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tickets:
    name: Ticket storage PHP ${{ matrix.php }} and MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-ticket-test -f tests/invitations/Dockerfile tests/invitations
      - name: Native authority privacy read state and competing requests
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-ticket-test sh -ec '
              for source in site/app/support/ticket*.php site/database/schema/support_tickets_schema.php site/database/migrations/support_tickets_migrate.php tests/support_tickets_native.php; do php -l "$source"; done
              php tests/support_tickets_native.php
            '
      - name: Preserve named native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-tickets-${{ matrix.php }}-${{ github.sha }}
          path: qa/support-tickets-native-results.json
          if-no-files-found: warn
          retention-days: 14
