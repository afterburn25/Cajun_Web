name: Mail reply and forward content checks
on:
  push:
    branches: [main, codex/mail-replies-forwards]
    paths: ['foundation/mail-compose/**', 'foundation/mail-receiving/**', 'tests/mail-compose/**', '.github/workflows/mail-replies.yml']
  pull_request:
    paths: ['foundation/mail-compose/**', 'foundation/mail-receiving/**', 'tests/mail-compose/**', '.github/workflows/mail-replies.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mail-replies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content:
    name: Reply and forward PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, iconv, ctype, dom
          coverage: none
      - name: Maintained parsing and bounded editable content
        run: |
          mkdir -p qa
          git rev-parse HEAD > qa/mail-replies-source.txt
          for source in foundation/mail-compose/*.php tests/mail-compose/*.php; do php -l "$source"; done
          python3 tools/check_mail_vendor.py > qa/mail-replies-dependencies.txt
          php tests/mail-compose/reply.php > qa/mail-replies-default-results.json
          php -n -d extension=mbstring -d extension=iconv -d extension=ctype tests/mail-compose/reply.php --without-dom > qa/mail-replies-no-dom-results.json
          php tests/mail-compose/thread.php > qa/mail-thread-default-results.json
          php -n tests/mail-compose/thread.php > qa/mail-thread-no-ini-results.json
          php tests/mail-compose/run.php qa/mail-drafts-default-results.json
          php -n tests/mail-compose/run.php qa/mail-drafts-no-ini-results.json
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-replies-${{ matrix.php }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa/mail-*
          if-no-files-found: error
          retention-days: 14
