name: Hosting record storage checks
on:
  push:
    branches: [main, codex/hosting-storage]
    paths: ['site/app/hosting/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'foundation/hosting/**', 'site/includes/foundation/hosting/**', 'tests/hosting_records*.php', 'tests/hosting_storage_recovery_cases.php', '.github/workflows/hosting-records.yml', 'site/app/**', 'site/includes/**', 'site/config/**', 'foundation/**', 'tests/invitations/**']
  pull_request:
    paths: ['site/app/hosting/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'foundation/hosting/**', 'site/includes/foundation/hosting/**', 'tests/hosting_records*.php', 'tests/hosting_storage_recovery_cases.php', '.github/workflows/hosting-records.yml', 'site/app/**', 'site/includes/**', 'site/config/**', 'foundation/**', 'tests/invitations/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-records-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native-settings:
    name: Hosting records PHP ${{ matrix.php }} and MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['3306/tcp']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-hosting-test -f tests/invitations/Dockerfile tests/invitations
      - name: Native owner records and competing process tests
        env:
          CWP_TEST_PORT: ${{ job.services.database.ports['3306'] }}
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-hosting-test sh -ec '
              for source in site/app/hosting/*.php site/database/schema/hosting_records_schema.php site/database/migrations/hosting_records_migrate.php tests/hosting_records*.php tests/hosting_storage_recovery_cases.php; do php -l "$source"; done
              php tests/hosting_records_native.php
              for report in qa/hosting-*-native-results.json; do cat "$report"; printf "\n"; done
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-records-${{ matrix.php }}-${{ github.sha }}
          path: |
            qa/hosting-records-native-results.json
          if-no-files-found: warn
          retention-days: 14
