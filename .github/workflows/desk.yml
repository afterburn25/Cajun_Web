name: Service-desk contract checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Service-desk checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and service-desk checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/desk/*.php tests/desk/*.php; do php -l "$source"; done
            php tests/desk/run.php
            php -n tests/desk/run.php  # regression: no php.ini, no optional extensions
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated service-desk contract checks only. No queues, persistence, mail or UI are tested by this job.' >> "$GITHUB_STEP_SUMMARY"
