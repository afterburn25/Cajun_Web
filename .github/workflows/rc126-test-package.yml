name: RC exact-source test package (no live operations)
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: rc-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean recorded source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          php -v
          node -v
          python3 -V
      - name: Verify generated source is current
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py --refresh
          git diff --exit-code -- site/ foundation/
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build and validate exact-source RC staging
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py --commit "$GITHUB_SHA" --stage-rc rc-upload
          git diff --exit-code
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest=json.loads(Path('dist/manifest.json').read_text(encoding='utf-8'))
          print('version='+manifest['version'])
          PY
      - name: Upload directly extractable installation files (no ZIP inside ZIP)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CajunWebPro-${{ steps.package.outputs.version }}-RC-TEST-COMPLETE-UPLOAD-${{ github.sha }}
          path: rc-upload/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
