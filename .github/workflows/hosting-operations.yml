name: Hosting operation storage checks
on:
  push:
    branches: [main, codex/hosting-operations, codex/hosting-provision-retry, codex/hosting-deprovision-retry, codex/hosting-reconciliation, codex/hosting-reconciliation-storage]
    paths: ['site/app/hosting/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'foundation/hosting/**', 'site/includes/foundation/hosting/**', 'tests/hosting_*native.php', '.github/workflows/hosting-operations.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-settings:
    name: Hosting operations PHP ${{ matrix.php }} and ${{ matrix.database.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-hosting-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Native owner records and competing process tests
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-hosting-test sh -ec '
              for source in site/app/hosting/*.php site/database/schema/hosting_*schema.php site/database/migrations/hosting_*migrate.php tests/hosting_*native.php; do php -l "$source"; done
              php tests/hosting_records_native.php
              php tests/hosting_operations_native.php
              php tests/hosting_retry_native.php
              php tests/hosting_delete_retry_native.php
              php tests/hosting_reconciliation_native.php
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-operations-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: |
            qa/hosting-records-native-results.json
            qa/hosting-operations-native-results.json
            qa/hosting-retry-native-results.json
            qa/hosting-delete-retry-native-results.json
            qa/hosting-reconciliation-native-results.json
          if-no-files-found: warn
          retention-days: 14
