name: Scheduled provider refresh checks
on:
  push:
    branches: [main, codex/twentyi-scheduled-refresh]
    paths: ['site/app/providers/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'tests/provider_schedule*.php', '.github/workflows/provider-schedule.yml']
  pull_request:
    paths: ['site/app/providers/**', 'site/database/**', 'site/admin/**', 'site/includes/layout/provider_services.php', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'tests/provider_schedule*.php', '.github/workflows/provider-schedule.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-schedule-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native-schedule:
    name: Scheduled inventory PHP ${{ matrix.php }} and ${{ matrix.database.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-inventory-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Native approvals, scheduled reads, concurrency and recovery
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-inventory-test sh -ec '
              for source in site/app/providers/*.php site/database/schema/provider_inventory_schema.php site/database/migrations/provider_inventory_migrate.php site/includes/layout/provider_services.php tests/provider_schedule*.php; do php -l "$source"; done
              php tests/provider_schedule_document.php
              php -n tests/provider_schedule_document.php
              php tests/provider_schedule_native.php
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-schedule-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: qa/provider-schedule-*-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verification scope
        if: always()
        run: |
          echo 'Native scheduled read approval, leases, concurrency, history-loss recovery and rollback: synthetic fixtures against disposable MariaDB/MySQL with PHP view rendering. No real 20i API call, credential, browser or deployment is exercised.' >> "$GITHUB_STEP_SUMMARY"
