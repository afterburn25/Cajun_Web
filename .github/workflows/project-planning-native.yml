name: Native project-planning storage checks
on:
  push:
    branches: [main, codex/project-planning-storage]
    paths: ['site/app/projects/**', 'site/app/clients/**', 'site/app/staff/**', 'site/app/support/sessions.php', 'site/includes/auth/**', 'site/database/**', 'foundation/project-planning/**', 'site/includes/foundation/project-planning/**', 'tests/project_planning_native*.php', 'tests/project-planning/**', '.github/workflows/project-planning-native.yml']
  pull_request:
    paths: ['site/app/projects/**', 'site/app/clients/**', 'site/app/staff/**', 'site/app/support/sessions.php', 'site/includes/auth/**', 'site/database/**', 'foundation/project-planning/**', 'site/includes/foundation/project-planning/**', 'tests/project_planning_native*.php', 'tests/project-planning/**', '.github/workflows/project-planning-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-planning-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-planning-test -f tests/invitations/Dockerfile tests/invitations
      - name: Validate native history and deployed records
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-planning-test sh -ec '
              for source in site/app/projects/planning*.php site/database/schema/project_planning_schema.php site/database/migrations/project_planning_migrate.php site/includes/foundation/project-planning/*.php tests/project_planning_native*.php tests/project-planning/*.php; do php -l "$source"; done
              for source in foundation/project-planning/*.php; do cmp "$source" "site/includes/$source"; done
              php -d memory_limit=128M tests/project_planning_native.php
              php tests/project-planning/records.php --deployment > qa/project-planning-deployed-default.json
              php -n tests/project-planning/records.php --deployment > qa/project-planning-deployed-no-ini.json
            '
      - name: Preserve named evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-planning-native-${{ matrix.php }}-${{ github.sha }}
          path: qa/project-planning-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Record scope
        if: always()
        run: echo 'Synthetic MariaDB authority, history, replay, concurrency, capacity and audit rollback; exact deployed pure records. No dashboard, HTTP/browser, activity dispatch or provider acceptance.' >> "$GITHUB_STEP_SUMMARY"
