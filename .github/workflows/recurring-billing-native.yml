name: Native recurring agreement and period invoice checks
on:
  push:
    branches: [main, feature/software-license-commerce-20261025, codex/recurring-billing-records, codex/twentyi-recurring-eligibility, codex/twentyi-recurring-ui, codex/twentyi-service-orders, codex/twentyi-catalog-controls, codex/twentyi-catalog-readiness]
    paths: ['site/app/providers/plan_catalog*.php', 'site/includes/layout/provider_plan_catalog.php', 'tests/provider_plan_catalog*.php', 'site/app/billing/**', 'site/app/hosting/order*.php', 'site/app/hosting/fulfillment*.php', 'site/app/hosting/operations.php', 'site/app/hosting/reconciliation.php', 'site/app/providers/inventory.php', 'site/app/hosting/storage.php', 'tests/hosting_fulfillment*_cases.php', 'site/includes/layout/service_orders.php', 'site/includes/layout/hosting_*.php', 'tests/service_orders_*.php', 'site/app/plans/**', 'site/app/staff/**', 'site/app/clients/**', 'site/database/**', 'foundation/recurring-billing/**', 'foundation/billing-calendar/**', 'site/includes/foundation/recurring-billing/**', 'site/includes/foundation/billing-calendar/**', 'tests/recurring_billing_*.php', 'tests/license_financ*.php', 'tests/finance_capture_snapshot_native.php', 'tests/finance_charge_*.php', 'tests/finance_initial_*.php', 'tests/finance_enrollment_*.php', 'tests/finance_payoff_retirement*.php', 'tests/finance_replacement_payoff*.php', 'tests/finance_replacement_receipts_native.php', 'tests/finance_replacement_pending_native.php', 'site/app/licenses/financ*.php', 'site/app/licenses/finance_installments.php', 'tests/ledger_*.php', '.github/workflows/recurring-billing-native.yml']
  pull_request:
    paths: ['site/app/providers/plan_catalog*.php', 'site/includes/layout/provider_plan_catalog.php', 'tests/provider_plan_catalog*.php', 'site/app/billing/**', 'site/app/hosting/order*.php', 'site/app/hosting/fulfillment*.php', 'site/app/hosting/operations.php', 'site/app/hosting/reconciliation.php', 'site/app/providers/inventory.php', 'site/app/hosting/storage.php', 'tests/hosting_fulfillment*_cases.php', 'site/includes/layout/service_orders.php', 'site/includes/layout/hosting_*.php', 'tests/service_orders_*.php', 'site/app/plans/**', 'site/app/staff/**', 'site/app/clients/**', 'site/database/**', 'foundation/recurring-billing/**', 'foundation/billing-calendar/**', 'site/includes/foundation/recurring-billing/**', 'site/includes/foundation/billing-calendar/**', 'tests/recurring_billing_*.php', 'tests/license_financ*.php', 'tests/finance_capture_snapshot_native.php', 'tests/finance_charge_*.php', 'tests/finance_initial_*.php', 'tests/finance_enrollment_*.php', 'tests/finance_payoff_retirement*.php', 'tests/finance_replacement_payoff*.php', 'tests/finance_replacement_receipts_native.php', 'tests/finance_replacement_pending_native.php', 'site/app/licenses/financ*.php', 'site/app/licenses/finance_installments.php', 'tests/ledger_*.php', '.github/workflows/recurring-billing-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recurring-billing-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native-recurring:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-recurring-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Preserve newer one-time finance outcomes under delayed captures
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-recurring-test sh -ec '
              mkdir -p qa
              php -l tests/finance_capture_snapshot_native.php
              php tests/finance_capture_snapshot_native.php site/app/billing/finance_charge.php fc_ci_capture_ > qa/finance-capture-snapshot-native-results.json
              cat qa/finance-capture-snapshot-native-results.json
            '
      - name: Bind delayed checkout results to their original finance attempt
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-recurring-test sh -ec '
              mkdir -p qa
              php -l tests/finance_charge_attempt_bindings.php
              php -l tests/finance_charge_response_native.php
              php tests/finance_charge_attempt_bindings.php > qa/finance-charge-attempt-bindings.json
              php tests/finance_charge_response_native.php site/app/billing/finance_charge.php fc_ci_response_ > qa/finance-charge-response-native-results.json
              cat qa/finance-charge-attempt-bindings.json
              cat qa/finance-charge-response-native-results.json
            '
      - name: Initial financing enrollment from verified ledger payments
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-recurring-test sh -ec '
              mkdir -p qa
              php -l tests/finance_initial_enrollment_handler.php
              php -l tests/finance_initial_enrollment_native.php
              php tests/finance_initial_enrollment_handler.php > qa/finance-initial-enrollment-handler.json
              php tests/finance_initial_enrollment_native.php fie_ci_native_ > qa/finance-initial-enrollment-native.json
              php -l tests/finance_enrollment_payoff_native.php
              php -l tests/finance_enrollment_payoff_boundaries.php
              php -l tests/finance_enrollment_sandbox_boundary.php
              php tests/finance_enrollment_sandbox_boundary.php > qa/finance-enrollment-sandbox-boundary.json
              php tests/finance_enrollment_payoff_native.php fep_ci_native_ > qa/finance-enrollment-payoff-native.json
              php -l tests/finance_payoff_retirement_native.php
              php -l tests/finance_payoff_retirement_boundaries.php
              php -l tests/finance_payoff_retirement_guards.php
              php -l tests/finance_payoff_retirement_settlement.php
              php tests/finance_payoff_retirement_native.php fep_ci_retire_ > qa/finance-payoff-retirement-native.json
              php tests/finance_payoff_retirement_native.php fep_ci_owner_ "$PWD" owner_exit > qa/finance-payoff-retirement-owner.json
              php tests/finance_payoff_retirement_settlement.php fep_ci_settle_ > qa/finance-payoff-retirement-settlement.json
              cat qa/finance-payoff-retirement-owner.json
              cat qa/finance-payoff-retirement-settlement.json
              php -l tests/finance_replacement_payoff_native.php
              php -l tests/finance_replacement_payoff_boundaries.php
              php tests/finance_replacement_payoff_native.php fep_ci_replace_ > qa/finance-replacement-payoff-native.json
              cat qa/finance-replacement-payoff-native.json
              php -l tests/finance_replacement_receipts_native.php
              php tests/finance_replacement_receipts_native.php fep_ci_receipt_ > qa/finance-replacement-receipts-native.json
              cat qa/finance-replacement-receipts-native.json
              php -l tests/finance_replacement_pending_native.php
              php tests/finance_replacement_pending_native.php fep_ci_pending_ > qa/finance-replacement-pending-native.json
              cat qa/finance-replacement-pending-native.json
              php -l tests/finance_initial_receipts_native.php
              php -l tests/finance_initial_receipts_boundaries.php
              php tests/finance_initial_receipts_native.php fep_ci_initrc_ > qa/finance-initial-receipts-native.json
              cat qa/finance-initial-receipts-native.json
              cat qa/finance-payoff-retirement-native.json
              cat qa/finance-initial-enrollment-handler.json
              cat qa/finance-initial-enrollment-native.json
              cat qa/finance-enrollment-payoff-native.json
              cat qa/finance-enrollment-sandbox-boundary.json
            '
      - name: Native consent and unique period invoices
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-recurring-test sh -ec '
              for source in site/app/billing/recurring_billing*.php site/app/billing/finance_*.php site/app/licenses/financ*.php site/app/licenses/finance_installments.php site/database/schema/recurring_billing_schema.php site/database/schema/license_financ*.php site/database/migrations/recurring_billing_migrate.php site/database/migrations/license_financ*.php tests/recurring_billing_*.php tests/license_financ*.php tests/ledger_*.php site/app/billing/ledger_fulfillment.php site/app/hosting/order*.php site/includes/layout/service_orders.php site/includes/layout/hosting_order_links.php site/includes/layout/hosting_fulfillment.php site/database/schema/service_orders_schema.php site/database/migrations/service_orders_migrate.php site/database/schema/hosting_order_links_schema.php site/database/migrations/hosting_order_links_migrate.php site/app/hosting/fulfillment*.php site/database/schema/hosting_fulfillment_schema.php site/database/migrations/hosting_fulfillment_migrate.php tests/hosting_fulfillment*_cases.php tests/service_orders_*.php; do php -l "$source"; done
              cmp foundation/billing-calendar/BillingCalendar.php site/includes/foundation/billing-calendar/BillingCalendar.php
              cmp foundation/recurring-billing/RecurringBillingTerms.php site/includes/foundation/recurring-billing/RecurringBillingTerms.php
              cmp foundation/recurring-billing/RecurringBillingSchedule.php site/includes/foundation/recurring-billing/RecurringBillingSchedule.php
              mkdir -p qa
              php tests/provider_plan_catalog_document.php qa/provider-plan-catalog-document-default.json
              php -n tests/provider_plan_catalog_document.php qa/provider-plan-catalog-document-noini.json
              php -d memory_limit=128M tests/recurring_billing_native.php
              php tests/license_finance_reconcile_native.php site/app/billing/finance_subscription.php fq_ci_recon_ > qa/license-finance-reconcile-native-results.json
              cat qa/license-finance-reconcile-native-results.json
              cat qa/service-orders-native-results.json
              cat qa/service-orders-links-native-results.json
              cat qa/service-orders-link-views-native-results.json
              cat qa/hosting-fulfillment-native-results.json
              cat qa/hosting-fulfillment-forms-native-results.json
              cat qa/hosting-confirmation-native-results.json
              cat qa/recurring-billing-native-results.json
              php tests/recurring_billing_legacy_ledger.php
              cat qa/ledger-native-results.json
              php tests/recurring-billing/forms.php qa/recurring-billing-forms-default.json
              php -n tests/recurring-billing/forms.php qa/recurring-billing-forms-noini.json
            '
      - name: Print retained native order and recurring reports
        if: always()
        run: |
          for report in qa/service-orders-native-results.json qa/service-orders-links-native-results.json qa/service-orders-link-views-native-results.json qa/hosting-fulfillment-native-results.json qa/hosting-fulfillment-forms-native-results.json qa/hosting-confirmation-native-results.json qa/recurring-billing-native-results.json; do
            if test -f "$report"; then cat "$report"; printf '\n'; fi
          done
      - name: Preserve actual named evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recurring-billing-native-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: |
            qa/recurring-billing-native-results.json
            qa/license-finance-reconcile-native-results.json
            qa/finance-capture-snapshot-native-results.json
            qa/finance-charge-attempt-bindings.json
            qa/finance-charge-response-native-results.json
            qa/finance-initial-enrollment-handler.json
            qa/finance-initial-enrollment-native.json
            qa/finance-enrollment-payoff-native.json
            qa/finance-enrollment-sandbox-boundary.json
            qa/finance-payoff-retirement-native.json
            qa/finance-payoff-retirement-owner.json
            qa/finance-payoff-retirement-settlement.json
            qa/finance-replacement-payoff-native.json
            qa/finance-replacement-receipts-native.json
            qa/finance-replacement-pending-native.json
            qa/finance-initial-receipts-native.json
            qa/service-orders-native-results.json
            qa/service-orders-links-native-results.json
            qa/service-orders-link-views-native-results.json
            qa/hosting-fulfillment-native-results.json
            qa/hosting-fulfillment-forms-native-results.json
            qa/hosting-confirmation-native-results.json
            qa/provider-plan-catalog-native-results.json
            qa/provider-plan-catalog-document-default.json
            qa/provider-plan-catalog-document-noini.json
            qa/ledger-native-results.json
            qa/recurring-billing-forms-default.json
            qa/recurring-billing-forms-noini.json
          if-no-files-found: error
          retention-days: 14
      - name: Scope
        if: always()
        run: echo 'Native MariaDB/MySQL agreement/consent/history and unique period invoices with current authority, replacement, replay, concurrent workers and rollback. Historical fixtures are synthetic; no HTTP/browser, scheduler, merchant or provider acceptance.' >> "$GITHUB_STEP_SUMMARY"
