name: 1.26.1 main-history reconciliation
on:
  push:
    branches: [chatgpt/1261-main-reconcile-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-reconcile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconcile:
    if: github.ref == 'refs/heads/chatgpt/1261-main-reconcile-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.record.outputs.source_sha }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile only the reviewed main history without modifying runtime
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git config user.name 'CajunWebPro reconciliation builder'
          git config user.email 'reconciliation-builder@users.noreply.github.com'
          python3 tools/integration/reconcile_main.py
      - name: Record merge on isolated branch with concurrent-head checks
        id: record
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          branch='refs/heads/chatgpt/1261-main-reconcile-20261030'
          if git('ls-remote','origin','refs/heads/main').split()[0]!='0099b9190756c31e690b83b2cdf93c366de03f5c':
              raise SystemExit('Main advanced; reconcile it before any push')
          if git('ls-remote','origin',branch).split()[0]!=os.environ['EXPECTED_HEAD']:
              raise SystemExit('Candidate branch moved; refuse overwrite')
          if git('status','--porcelain'):raise SystemExit('Dirty merge candidate')
          head=git('rev-parse','HEAD')
          if head!=os.environ['EXPECTED_HEAD']:
              auth=base64.b64encode(('x-access-token:'+os.environ['SOURCE_TOKEN']).encode()).decode()
              env={**os.environ,'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+auth}
              subprocess.run(['git','push','origin','HEAD:'+branch],env=env,check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('source_sha='+head+'\n')
          print('Exact reconciled source:',head)
          PY
      - name: Preserve exact reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciliation-source-${{ github.sha }}
          path: docs/MAIN_RECONCILIATION_1.26.1.json
          if-no-files-found: warn
          retention-days: 14
  verify:
    needs: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CWP_SOURCE_SHA: ${{ needs.reconcile.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.reconcile.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require preserved main ancestry and exact delivered application
        run: |
          git merge-base --is-ancestor 0099b9190756c31e690b83b2cdf93c366de03f5c HEAD
          git merge-base --is-ancestor 5c54d5fdd0c2ca1b006885b7fc533e8ba9d1140d HEAD
          git diff --exit-code 5c54d5fdd0c2ca1b006885b7fc533e8ba9d1140d HEAD -- site foundation tools/structure tools/build.py VERSION START-HERE.txt
          python3 tools/build.py --refresh
          git diff --exit-code
          python3 tools/check_docs.py
      - name: Preserve sandbox credentials and lifecycle security contracts
        run: |
          mkdir -p qa/main-reconciliation
          python3 tests/sandbox_workflow_contract.py
          python3 tests/anet_sandbox_runtime_contract.py
          php tests/licensing_action_boundary.php > qa/main-reconciliation/licensing-boundary.json
          php tests/licensing_workspace_contract.php > qa/main-reconciliation/licensing-workspace.json
          php tests/master_portal_policy.php
      - name: Run session hosting and financial regressions
        run: python3 tools/integration/portable_checks.py --root . --out qa/main-reconciliation/portable
      - name: Verify clean-source packaging and all build refusal checks
        run: |
          python3 tools/build.py --commit "$CWP_SOURCE_SHA" > qa/main-reconciliation/build.log 2>&1
          python3 tests/build_guards.py > qa/main-reconciliation/build-guards.log 2>&1
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads(Path('docs/MAIN_RECONCILIATION_1.26.1.json').read_text())
          assert r['runtime_matches_delivered_release'] is True
          report={'passed':True,'source_sha':os.environ['CWP_SOURCE_SHA'],'main_ancestor':r['main_sha'],'release_ancestor':r['release_sha'],'runtime_byte_identical':True,'scope':'Ancestry, exact shipping bytes, sandbox secret isolation, portable policies and clean-source build. Full main PR checks remain separate; no live operations.'}
          Path('qa/main-reconciliation/results.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Preserve reports without replacing delivered ZIPs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-reconciliation-checks-${{ needs.reconcile.outputs.source_sha }}
          path: qa/
          if-no-files-found: error
          retention-days: 14
