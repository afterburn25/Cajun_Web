name: Native cloud provider discovery
on:
  push:
    branches: [main, codex/twentyi-cloud-providers]
    paths: ['site/app/providers/**', 'site/admin/**', 'foundation/twentyi-inventory/**', 'foundation/twentyi-inventory-reader/**', 'foundation/twentyi/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'tests/provider_cloud_providers_native.php', 'tests/twentyi-inventory-reader/cloud-providers.php', '.github/workflows/provider-cloud-providers.yml']
  pull_request:
    paths: ['site/app/providers/**', 'site/admin/**', 'foundation/twentyi-inventory/**', 'foundation/twentyi-inventory-reader/**', 'foundation/twentyi/**', 'site/database/**', 'site/includes/layout/provider_services.php', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'tests/provider_cloud_providers_native.php', 'tests/twentyi-inventory-reader/cloud-providers.php', '.github/workflows/provider-cloud-providers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-cloud-providers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native-cloud-providers:
    name: Cloud providers PHP ${{ matrix.php }} and ${{ matrix.database.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify generated deployment inventory and documentation
        run: |
          PYTHONPATH=tools python -B -c 'import build; build.generated(False)'
          python -B tools/check_docs.py
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-inventory-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Native cloud provider authority, history and hash parity
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-inventory-test sh -ec '
              for source in site/app/providers/cloud_providers*.php site/admin/views/provider_cloud_providers.php site/admin/controllers/provider_cloud_providers.php tests/provider_cloud_providers_native.php; do php -l "$source"; done
              php tests/provider_cloud_providers_native.php
              php tests/twentyi-inventory-reader/cloud-providers.php > qa/cloud-provider-reader-default.json
              php -n tests/twentyi-inventory-reader/cloud-providers.php > qa/cloud-provider-reader-noini.json
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-cloud-providers-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: |
            qa/provider-cloud-providers-native-results.json
            qa/cloud-provider-reader-default.json
            qa/cloud-provider-reader-noini.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verification scope
        if: always()
        run: |
          echo 'Native cloud provider discovery, exact observed identities, shared read executor, sequence/counter/audit recovery and SQL/PHP hash parity. Disposable MariaDB/MySQL and synthetic provider only; no real API, browser or deployment.' >> "$GITHUB_STEP_SUMMARY"
