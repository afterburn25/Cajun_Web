name: Native Directory listing change controls
on:
  push:
    branches: [main, codex/twentyi-directory-listing-controls]
    paths: ['site/app/providers/**', 'site/admin/**', 'site/database/**', 'site/includes/foundation/**', 'foundation/provider/**', 'foundation/twentyi/**', 'foundation/twentyi-operations/**', 'tests/twentyi-directory-listing-controls/**', 'tests/directory_listing_controls*.php', 'tests/provider_directory_listing_controls*', 'tests/provider_directory_controls_http_contract.py', 'tests/provider_http_server.py', 'tests/provider_directory_listing_native.php', 'tests/directory_listing*.php', '.github/workflows/provider-directory-listing-controls.yml']
  pull_request:
    paths: ['site/app/providers/**', 'site/admin/**', 'site/database/**', 'site/includes/foundation/**', 'foundation/provider/**', 'foundation/twentyi/**', 'foundation/twentyi-operations/**', 'tests/twentyi-directory-listing-controls/**', 'tests/directory_listing_controls*.php', 'tests/provider_directory_listing_controls*', 'tests/provider_directory_controls_http_contract.py', 'tests/provider_http_server.py', 'tests/provider_directory_listing_native.php', 'tests/directory_listing*.php', '.github/workflows/provider-directory-listing-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: directory-listing-controls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native-history:
    name: Directory listing changes ${{ matrix.php }} and ${{ matrix.database.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify generated deployment inventory and documentation
        run: |
          PYTHONPATH=tools python -B -c 'import build; build.generated(False)'
          python -B tools/check_docs.py
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-inventory-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Native Directory listing dispatch and readback boundaries
        run: |
          mkdir -p qa
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-inventory-test sh -ec '
              for source in site/app/providers/directory_listing_controls*.php site/database/schema/provider_directory_listing_controls_schema.php site/admin/controllers/provider_directory_listing_controls.php tests/provider_directory_listing_controls_native.php tests/directory_listing_controls*.php; do php -l "$source"; done
              php tests/twentyi-directory-listing-controls/run.php > qa/directory-listing-control-contract-results.json
              php -n tests/twentyi-directory-listing-controls/run.php > qa/directory-listing-control-contract-no-ini-results.json
              php tests/directory_listing_controls_transport.php > qa/directory-listing-control-transport-results.json
              php -n tests/directory_listing_controls_transport.php > qa/directory-listing-control-transport-no-ini-results.json
              php tests/directory_listing_controls_recovery.php > qa/directory-listing-control-recovery-results.json
              php -n tests/directory_listing_controls_recovery.php > qa/directory-listing-control-recovery-no-ini-results.json
              php tests/provider_directory_listing_controls_native.php
              php tests/directory_listing_contract.php > qa/directory-listing-document-results.json
              php -n tests/directory_listing_contract.php > qa/directory-listing-document-no-ini-results.json
              php tests/directory_listing_transport.php > qa/directory-listing-transport-results.json
              php -n tests/directory_listing_transport.php > qa/directory-listing-transport-no-ini-results.json
              php tests/provider_directory_listing_native.php
              php tests/force_ssl_controls_transport.php > qa/force-ssl-control-transport-results.json
              php -n tests/force_ssl_controls_transport.php > qa/force-ssl-control-transport-no-ini-results.json
              php tests/provider_force_ssl_controls_native.php
              php tests/twentyi-operations/run.php qa/twentyi-operation-contract-results.json
              php tests/provider_operations_native.php
              php tests/provider_operations_execute_native.php
              php tests/document_roots_transport.php > qa/document-roots-transport-integrated-results.json
            '
      - name: Check actual synthetic HTTP handler offline
        run: python -B tests/provider_directory_controls_http_contract.py > qa/directory-listing-controls-http-handler-results.json
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-listing-controls-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: |
            qa/directory-listing-control-contract-results.json
            qa/directory-listing-control-contract-no-ini-results.json
            qa/directory-listing-control-transport-results.json
            qa/directory-listing-control-transport-no-ini-results.json
            qa/directory-listing-control-recovery-results.json
            qa/directory-listing-control-recovery-no-ini-results.json
            qa/directory-listing-controls-http-handler-results.json
            qa/provider-directory-listing-controls-native-results.json
            qa/directory-listing-document-results.json
            qa/directory-listing-document-no-ini-results.json
            qa/directory-listing-transport-results.json
            qa/directory-listing-transport-no-ini-results.json
            qa/provider-directory-listing-native-results.json
            qa/force-ssl-control-transport-results.json
            qa/force-ssl-control-transport-no-ini-results.json
            qa/provider-force-ssl-controls-native-results.json
            qa/twentyi-operation-contract-results.json
            qa/provider-operations-native-results.json
            qa/provider-execution-native-results.json
            qa/document-roots-transport-integrated-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verification scope
        if: always()
        run: |
          echo 'Exact owner Directory listing consent, one shared-gateway dispatch, pre-perform refusal, narrowly recovered missing dispatch witness from a durable finished ledger, interrupted-request fences and fresh exact readback. Recovery performs no provider call; missing or claimed ledger stays fenced. Desired flag observed after a request does not prove causality or which files visitors can access. Disposable database and real process contention with synthetic transport only; no live API, browser or deployment.' >> "$GITHUB_STEP_SUMMARY"
