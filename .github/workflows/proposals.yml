name: Proposal version-model checks

on:
  pull_request:
    paths: ['foundation/proposals/**', 'tests/proposals/**', 'site/app/marketing/proposals.php', 'site/includes/layout/proposals.php', 'site/database/schema/proposals_schema.php', 'site/database/migrations/proposals_migrate.php', '.github/workflows/proposals.yml']
  push:
    branches: [main, 'devin/non20i-*']
    paths: ['foundation/proposals/**', 'tests/proposals/**', 'site/app/marketing/proposals.php', 'site/includes/layout/proposals.php', 'site/database/schema/proposals_schema.php', 'site/database/migrations/proposals_migrate.php', '.github/workflows/proposals.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proposals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Proposal checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and proposal checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/proposals/*.php tests/proposals/*.php; do php -l "$source"; done
            php tests/proposals/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated version/approval state checks only. No persistence, mail, signature, admin UI or application integration is tested by this job.' >> "$GITHUB_STEP_SUMMARY"
