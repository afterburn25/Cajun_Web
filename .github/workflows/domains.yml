name: Domain contract checks

on:
  pull_request:
  push:
    branches: [main, devin/domains-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domains:
    name: Domains PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and domain lifecycle checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/domains/*.php tests/domains/*.php; do php -l "$source"; done
            php tests/domains/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Domain lifecycle unit checks only (synthetic prices, no registrar calls). Cart UI, persistence, provider adapter and real registration/renewal/transfer remain untested by this job.' >> "$GITHUB_STEP_SUMMARY"
