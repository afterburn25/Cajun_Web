name: Pure registrar expiry contract checks

on:
  push:
    branches: [codex/twentyi-domain-expiry-contract]
    paths: ['foundation/twentyi-domain-expiry/**', 'foundation/twentyi-domain-contracts/DomainContractBinding.php', 'foundation/twentyi-inventory/InventoryDomain.php', 'foundation/provider/TransportRequest.php', 'foundation/provider/TransportResponse.php', 'tests/domain_expiry_contract.php', '.github/workflows/domain-expiry-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-expiry-contract-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pure-contract:
    name: Pure registrar expiry PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out exact isolated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record exact source provenance
        run: |
          mkdir -p qa
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.')
          paths = sorted(root.glob('foundation/twentyi-domain-expiry/*.php')) + [
              root / 'foundation/twentyi-domain-contracts/DomainContractBinding.php',
              root / 'foundation/twentyi-inventory/InventoryDomain.php',
              root / 'foundation/provider/TransportRequest.php',
              root / 'foundation/provider/TransportResponse.php',
              root / 'tests/domain_expiry_contract.php',
              root / '.github/workflows/domain-expiry-contract.yml',
          ]
          evidence = {
              'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'github_sha': os.environ['GITHUB_SHA'],
              'requested_php': '${{ matrix.php }}',
              'scope': 'Pure synthetic contract only; test container has no network; no shipping integration',
              'sha256': {path.as_posix(): hashlib.sha256(path.read_bytes()).hexdigest() for path in paths},
          }
          (root / 'qa/source.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Run normal and minimal PHP without network
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -v "$PWD/qa:/qa" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            php --version > /qa/php-version.txt
            for source in foundation/twentyi-domain-expiry/*.php foundation/twentyi-domain-contracts/DomainContractBinding.php foundation/twentyi-inventory/InventoryDomain.php foundation/provider/TransportRequest.php foundation/provider/TransportResponse.php tests/domain_expiry_contract.php; do php -l "$source"; done
            php tests/domain_expiry_contract.php > /qa/domain-expiry-default.json
            php -n tests/domain_expiry_contract.php > /qa/domain-expiry-minimal.json
          '
      - name: Preserve exact named contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-expiry-contract-${{ matrix.php }}-${{ github.sha }}
          path: |
            qa/source.json
            qa/php-version.txt
            qa/domain-expiry-default.json
            qa/domain-expiry-minimal.json
          if-no-files-found: error
          retention-days: 14
      - name: Record acceptance limit
        if: always()
        run: echo 'Pure request/binding/parser checks only. No native application, current authorization, database, provider request, package, browser or release acceptance.' >> "$GITHUB_STEP_SUMMARY"
