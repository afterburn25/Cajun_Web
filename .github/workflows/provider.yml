name: Provider contract checks

on:
  pull_request:
  push:
    branches: [main, devin/provider-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    name: Provider PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and provider contract checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/provider/*.php tests/provider/*.php; do php -l "$source"; done
            php tests/provider/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Provider contract unit checks only (fixture transport, in-memory ledger). Admin settings UI, encrypted credential persistence, real 20i API calls, and database integration remain untested by this job.' >> "$GITHUB_STEP_SUMMARY"
