name: Software subscription lifecycle contract
on:
  push:
    branches:
      - feature/software-license-commerce-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subscription-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: php -l site/app/billing/authorize_net_contract.php
      - run: php -l site/app/billing/software_payment_review.php
      - run: php -l site/app/billing/software_subscription_settle.php
      - run: php -l site/app/billing/software_subscriptions.php
      - run: php -l tests/software_subscription_event_contract.php
      - run: php -l tests/software_subscription_gateway_contract.php
      - run: php -l tests/software_subscription_period_contract.php
      - run: php tests/software_subscription_event_contract.php
      - run: php tests/software_subscription_gateway_contract.php
      - run: php tests/software_subscription_period_contract.php
