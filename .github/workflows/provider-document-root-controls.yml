name: Native website folder change controls
on:
  push:
    branches: [main]
    paths: ['site/app/providers/**', 'site/admin/**', 'site/database/**', 'site/includes/foundation/**', 'foundation/provider/**', 'foundation/twentyi/**', 'foundation/twentyi-operations/**', 'tests/twentyi-operations/**', 'tests/provider_http_server.py', 'tests/provider_directory_controls_http_contract.py', 'tests/document_roots*.php', 'tests/provider_document_root_controls*', '.github/workflows/provider-document-root-controls.yml']
  pull_request:
    paths: ['site/app/providers/**', 'site/admin/**', 'site/database/**', 'site/includes/foundation/**', 'foundation/provider/**', 'foundation/twentyi/**', 'foundation/twentyi-operations/**', 'tests/twentyi-operations/**', 'tests/provider_http_server.py', 'tests/provider_directory_controls_http_contract.py', 'tests/document_roots*.php', 'tests/provider_document_root_controls*', '.github/workflows/provider-document-root-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: document-root-controls-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-history:
    name: Website folder changes ${{ matrix.php }} and ${{ matrix.database.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DOCUMENT_ROOT_CONTROLS: '1'
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify generated deployment inventory and documentation
        run: |
          PYTHONPATH=tools python -B -c 'import build; build.generated(False)'
          python -B tools/check_docs.py
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-inventory-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Native folder change dispatch and readback boundaries
        run: |
          mkdir -p qa
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT -e CWP_TEST_DOCUMENT_ROOT_CONTROLS \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-inventory-test sh -ec '
              for source in site/app/providers/document_root_controls*.php site/database/schema/provider_document_root_controls_schema.php site/admin/controllers/provider_document_root_controls.php tests/provider_document_root_controls_native.php; do php -l "$source"; done
              php tests/twentyi-operations/run.php qa/document-root-control-operations-default.json
              php -n tests/twentyi-operations/run.php qa/document-root-control-operations-minimal.json
              php tests/document_roots_contract.php > qa/document-roots-contract-default.json
              php -n tests/document_roots_contract.php > qa/document-roots-contract-minimal.json
              php tests/document_roots_transport.php > qa/document-roots-transport-default.json
              php -n tests/document_roots_transport.php > qa/document-roots-transport-minimal.json
              php tests/provider_document_roots_native.php
              php tests/provider_document_root_controls_native.php
            '
          python3 -B tests/provider_document_root_controls_http_contract.py > qa/provider-document-root-controls-handler-results.json
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-root-controls-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: |
            qa/document-root-control-operations-default.json
            qa/document-root-control-operations-minimal.json
            qa/document-roots-contract-default.json
            qa/document-roots-contract-minimal.json
            qa/document-roots-transport-default.json
            qa/document-roots-transport-minimal.json
            qa/provider-document-roots-native-results.json
            qa/provider-document-root-controls-native-results.json
            qa/provider-document-root-controls-handler-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verification scope
        if: always()
        run: |
          echo 'Owner-reviewed existing hostname and destination-folder request, exact single dispatch, immutable retained history, independent complete-map readback and finished-ledger-only local recovery. Manual hosting/directory attestation is not provider proof. Matching readback does not prove causality, directory existence or website routing. Disposable SQL and real process contention with synthetic transport only; no live API, browser, installed upgrade or deployment.' >> "$GITHUB_STEP_SUMMARY"
