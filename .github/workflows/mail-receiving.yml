name: Mail receiving checks
on:
  push:
    branches: [main]
    paths: ['foundation/mail-receiving/**', 'tests/mail-receiving/**', 'tools/check_mail_vendor.py', '.github/workflows/mail-receiving.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiving:
    name: Mail receiving PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, iconv, ctype, dom
          coverage: none
      - name: Exact dependencies and bounded receiving acceptance
        run: |
          mkdir -p qa
          git rev-parse HEAD > qa/mail-receiving-source.txt
          python3 tools/check_mail_vendor.py --reproduce > qa/mail-receiving-vendor.txt
          php tests/mail-receiving/run.php > qa/mail-receiving-results.json
          php tests/mail-receiving/session_test.php > qa/mail-receiving-session-results.json
          php tests/mail-receiving/body_test.php > qa/mail-message-body-results.json
          php tests/mail-receiving/attachment_test.php > qa/mail-message-attachment-results.json
          php tests/mail-receiving/append_test.php > qa/mail-message-append-results.json
          php tests/mail-receiving/message_session_test.php > qa/mail-message-session-results.json
          php -n -d extension=mbstring -d extension=iconv -d extension=ctype tests/mail-receiving/no_dom_test.php > qa/mail-message-no-dom-results.json
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --disable-pip-version-check cryptography==50.0.1
          .ci-venv/bin/python tests/mail-receiving/tls_test.py
          .ci-venv/bin/python tests/mail-receiving/message_tls_test.py
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-receiving-${{ matrix.php }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa/mail-*
          if-no-files-found: error
