name: Client authority checks
on:
  push:
    branches: [main, codex/client-authority]
    paths: ['site/app/clients/**', 'site/admin/controllers/studio.php', 'site/admin/controllers/router.php', 'site/portal/controllers/actions.php', 'site/admin/views/studio/**', 'site/app/hosting/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'foundation/hosting/**', 'site/includes/foundation/hosting/**', 'tests/hosting_*native.php', 'tests/client_authority*.php', '.github/workflows/client-authority.yml', 'site/app/**', 'site/includes/**', 'site/config/**', 'foundation/**', 'tests/invitations/**']
  pull_request:
    paths: ['site/app/clients/**', 'site/admin/controllers/studio.php', 'site/admin/controllers/router.php', 'site/portal/controllers/actions.php', 'site/admin/views/studio/**', 'site/app/hosting/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'foundation/hosting/**', 'site/includes/foundation/hosting/**', 'tests/hosting_*native.php', 'tests/client_authority*.php', '.github/workflows/client-authority.yml', 'site/app/**', 'site/includes/**', 'site/config/**', 'foundation/**', 'tests/invitations/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-authority-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-settings:
    name: Client authority PHP ${{ matrix.php }} and MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-hosting-test -f tests/invitations/Dockerfile tests/invitations
      - name: Native client authority and retained hosting tests
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-hosting-test sh -ec '
              for source in site/app/hosting/*.php site/app/clients/*.php site/admin/controllers/studio.php site/admin/views/studio/clients.php site/database/schema/hosting_*schema.php site/database/migrations/hosting_*migrate.php tests/hosting_*native.php tests/client_authority_native.php; do php -l "$source"; done
              php tests/client_authority_native.php
              php tests/hosting_records_native.php
              php tests/hosting_operations_native.php
            '
      - name: Preserve named client and hosting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-authority-${{ matrix.php }}-${{ github.sha }}
          path: |
            qa/client-authority-native-results.json
            qa/hosting-records-native-results.json
            qa/hosting-operations-native-results.json
          if-no-files-found: warn
          retention-days: 14
