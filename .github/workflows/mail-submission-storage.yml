name: Mail submission storage checks
on:
  push:
    branches: [main, codex/mail-submission]
    paths: ['site/app/mail/**', 'site/admin/controllers/mail_submissions.php', 'site/admin/views/mail_submissions.php', 'site/database/**', 'site/includes/foundation/mail-submission/**', 'site/app/staff/**', 'site/includes/auth/**', 'tests/mail_submissions_native.php', 'tests/mail_submission_dispatch_native.php', 'tests/mail_submission_forms.php', '.github/workflows/mail-submission-storage.yml']
  pull_request:
    paths: ['site/app/mail/**', 'site/admin/controllers/mail_submissions.php', 'site/admin/views/mail_submissions.php', 'site/database/**', 'site/includes/foundation/mail-submission/**', 'site/app/staff/**', 'site/includes/auth/**', 'tests/mail_submissions_native.php', 'tests/mail_submission_dispatch_native.php', 'tests/mail_submission_forms.php', '.github/workflows/mail-submission-storage.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mail-submission-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Submission storage PHP ${{ matrix.php }} and MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-submission-storage -f tests/invitations/Dockerfile tests/invitations
      - name: Native submission authority and persistence
        run: |
          python3 tools/check_mail_submission_vendor.py --require-mirror
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-submission-storage sh -ec '
              php -l site/app/mail/submissions.php
              php -l site/app/mail/submission_dispatch.php
              php -l site/app/mail/submission_views.php
              php -l site/admin/controllers/mail_submissions.php
              php -l site/admin/views/mail_submissions.php
              php -l site/database/schema/mail_submissions_schema.php
              php -l site/database/migrations/mail_submissions_migrate.php
              php -l tests/mail_submissions_native.php
              php tests/mail_submissions_native.php
              php -l tests/mail_submission_dispatch_native.php
              php tests/mail_submission_dispatch_native.php
              php tests/mail_submission_forms.php
              cp qa/mail-submission-forms-results.json qa/mail-submission-forms-default-results.json
              php -n tests/mail_submission_forms.php
            '
      - name: Preserve named native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-submission-storage-${{ matrix.php }}-${{ github.sha }}
          path: |
            qa/mail-submissions-native-results.json
            qa/mail-submission-dispatch-native-results.json
            qa/mail-submission-forms*-results.json
          if-no-files-found: error
          retention-days: 14
