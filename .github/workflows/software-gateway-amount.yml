name: Software gateway amount regression
on:
  push:
    branches:
      - feature/software-license-commerce-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-amount:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: php -l site/app/billing/authorize_net_contract.php
      - run: php -l tests/software_gateway_amount.php
      - run: php tests/software_gateway_amount.php
