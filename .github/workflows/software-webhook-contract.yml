name: Software webhook contract
on:
  push:
    branches:
      - main
      - feature/software-license-commerce-20261025
    paths:
      - site/app/billing/authorize_net_webhooks.php
      - site/app/billing/software_subscription_settle.php
      - tests/software_webhook_contract.php
      - .github/workflows/software-webhook-contract.yml
  pull_request:
    branches:
      - main
      - feature/software-license-commerce-20261025
    paths:
      - site/app/billing/authorize_net_webhooks.php
      - site/app/billing/software_subscription_settle.php
      - tests/software_webhook_contract.php
      - .github/workflows/software-webhook-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  webhook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: php -l site/app/billing/authorize_net_webhooks.php
      - run: php -l site/app/billing/software_subscription_settle.php
      - run: php -l tests/software_webhook_contract.php
      - run: php tests/software_webhook_contract.php
