name: Software webhook contract
on:
  push:
    branches:
      - feature/software-license-commerce-20261025
  pull_request:
    branches:
      - feature/software-license-commerce-20261025
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webhook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: php -l site/app/billing/authorize_net_webhooks.php
      - run: php -l tests/software_webhook_contract.php
      - run: php tests/software_webhook_contract.php
