name: Service-plan contract checks

on:
  pull_request:
    paths: ['foundation/service-plans/**', 'tests/service-plans/**', '.github/workflows/service-plans.yml']
  push:
    branches: [main, 'devin/non20i-*']
    paths: ['foundation/service-plans/**', 'tests/service-plans/**', '.github/workflows/service-plans.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-plans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Service-plan checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and service-plan checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/service-plans/*.php tests/service-plans/*.php; do php -l "$source"; done
            php tests/service-plans/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated service-plan/subscription contract checks only. No billing, persistence or application integration is tested by this job.' >> "$GITHUB_STEP_SUMMARY"
