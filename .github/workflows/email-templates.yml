name: Email-template contract checks

on:
  pull_request:
    paths:
      - 'foundation/email-templates/**'
      - 'tests/email-templates/**'
      - '.github/workflows/email-templates.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Email-template checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and template checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/email-templates/*.php tests/email-templates/*.php; do php -l "$source"; done
            php tests/email-templates/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated email-template/placeholder contract checks only. No compose UI, sending or persistence is tested by this job.' >> "$GITHUB_STEP_SUMMARY"
