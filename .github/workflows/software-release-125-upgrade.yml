name: Software published v1.25 upgrade gate
on:
  push:
    branches:
      - feature/software-license-commerce-20261025
    paths:
      - 'VERSION'
      - 'site/config/defaults.php'
      - 'tools/build.py'
      - 'tests/software_release_125_upgrade.py'
      - 'tests/software_release_125_harness_tests.py'
      - 'tests/organized_update_cases.py'
      - 'tests/inventory_retention_124_fixture.php'
      - 'tests/release_next_from_125.py'
      - 'tests/acceptance_environment.py'
      - '.github/workflows/software-release-125-upgrade.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'site/config/defaults.php'
      - 'tools/build.py'
      - 'tests/software_release_125_upgrade.py'
      - 'tests/software_release_125_harness_tests.py'
      - 'tests/organized_update_cases.py'
      - 'tests/inventory_retention_124_fixture.php'
      - 'tests/release_next_from_125.py'
      - 'tests/acceptance_environment.py'
      - '.github/workflows/software-release-125-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  published-125-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database: ['mariadb-10.11', 'mysql-8.4']
    services:
      mariadb:
        image: ${{ matrix.database == 'mysql-8.4' && 'mysql:8.4' || 'mariadb:10.11' }}
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: isolated-ci-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
      CWP_PHP_VERSION: ${{ matrix.php }}
      CWP_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check candidate version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          value=Path('VERSION').read_text().strip()
          parts=value.split('.')
          if len(parts)!=3 or any(not p.isdigit() for p in parts):
              raise SystemExit('VERSION must be numeric MAJOR.MINOR.PATCH')
          print('candidate='+value)
          print('run_gate='+('true' if tuple(map(int,parts))>(1,25,0) else 'false'))
          PY
      - name: Syntax-check future gate while release remains 1.25
        run: python3 -m py_compile tests/software_release_125_upgrade.py tests/organized_update_cases.py tests/software_release_125_harness_tests.py
      - name: Record deferred gate
        if: steps.version.outputs.run_gate != 'true'
        run: echo "Published v1.25 -> next-release upgrade gate is armed; candidate remains ${{ steps.version.outputs.candidate }}."
      - name: Install isolated release runtime
        if: steps.version.outputs.run_gate == 'true'
        run: |
          # Use one package source for the versioned CLI, extensions and Apache module.
          # Ubuntu 24.04 retains its distro PHP 8.3 path; other selected versions
          # require the PHP maintainer's signed Ubuntu Noble package repository.
          if [ "$CWP_PHP_VERSION" != "8.3" ]; then
            sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update -qq
            sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
            sudo add-apt-repository --yes --no-update ppa:ondrej/php
            # setup-php f3e473d116dcccaddc5834248c87452386958240 documents this
            # fixed mirror. Preserve Launchpad's original scoped publisher key.
            sudo python3 - <<'CWP_PHP_MIRROR'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('/etc/apt/sources.list.d/ondrej-ubuntu-php-noble.sources')
          primary = 'https://ppa.launchpadcontent.net/ondrej/php/ubuntu/'
          mirror = 'https://ppa.setup-php.com/ondrej/php/ubuntu/'
          fingerprint = 'B8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6'
          if source.is_symlink() or not source.is_file() or source.stat().st_size > 65536:
              raise SystemExit('Expected regular Noble PHP PPA source is unavailable')
          original = source.read_bytes()
          text = original.decode('utf-8')
          for field, expected in [('Types', 'deb'), ('URIs', primary), ('Suites', 'noble'), ('Components', 'main')]:
              if re.findall(r'^' + field + r': (.*)$', text, re.M) != [expected]:
                  raise SystemExit('Unexpected Noble PHP PPA source field: ' + field)
          if re.search(r'^(?:Trusted|Allow-Insecure|Allow-Weak|Allow-Downgrade-To-Insecure):', text, re.M | re.I):
              raise SystemExit('Unsafe repository trust override refused')
          keys = re.findall(r'^Signed-By:([^\n]*(?:\n[ \t][^\n]*)*)', text, re.M)
          if len(keys) != 1:
              raise SystemExit('Exactly one publisher Signed-By field is required')
          signed_by = '\n'.join('' if line.strip() == '.' else line.strip() for line in keys[0].splitlines()).strip()
          if signed_by.startswith('-----BEGIN PGP PUBLIC KEY BLOCK-----'):
              key = signed_by.encode('ascii')
          else:
              key_path = Path(signed_by)
              if key_path.parent not in (Path('/usr/share/keyrings'), Path('/etc/apt/keyrings')) or key_path.is_symlink() or not key_path.is_file() or key_path.stat().st_size > 65536:
                  raise SystemExit('Unexpected publisher key file')
              key = key_path.read_bytes()
          with tempfile.TemporaryDirectory(prefix='cwp-public-key-inspection-') as key_home:
              shown = subprocess.run(['gpg', '--batch', '--no-options', '--homedir', key_home, '--no-autostart', '--with-colons', '--show-keys'], input=key, capture_output=True, check=True).stdout.decode('utf-8')
          if len(re.findall(r'^pub:', shown, re.M)) != 1 or re.findall(r'^fpr:::::::::([A-F0-9]{40}):', shown, re.M)[:1] != [fingerprint]:
              raise SystemExit('Unexpected PHP PPA signing identity')
          changed = re.sub(r'^URIs: ' + re.escape(primary) + r'$', 'URIs: ' + mirror, text, count=1, flags=re.M).encode('utf-8')
          if changed.replace(mirror.encode(), primary.encode(), 1) != original or changed == original:
              raise SystemExit('Only the exact repository URI may change')
          source.write_bytes(changed)
          print('Noble PHP PPA mirror selected; original publisher Signed-By retained: ' + fingerprint)
          CWP_PHP_MIRROR
          fi
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update -qq
          sudo apt-get -o Acquire::Retries=5 install -y "php${CWP_PHP_VERSION}-cli" "php${CWP_PHP_VERSION}-mysql" "php${CWP_PHP_VERSION}-gd" "php${CWP_PHP_VERSION}-zip" "php${CWP_PHP_VERSION}-curl" "php${CWP_PHP_VERSION}-xml" "php${CWP_PHP_VERSION}-mbstring" apache2-bin "libapache2-mod-php${CWP_PHP_VERSION}"
          test -s "/usr/lib/apache2/modules/libphp${CWP_PHP_VERSION}.so"
          export PHP_BINARY="/usr/bin/php${CWP_PHP_VERSION}"
          test -x "$PHP_BINARY"
          printf 'PHP_BINARY=%s\n' "$PHP_BINARY" >> "$GITHUB_ENV"
          "$PHP_BINARY" -v
          "$PHP_BINARY" -m
          if [ "$CWP_DATABASE" = "mysql-8.4" ]; then
            docker exec -e MYSQL_PWD=isolated-ci-root-only ${{ job.services.mariadb.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
          fi
          python3 -m venv /tmp/cwp-release125-venv
          /tmp/cwp-release125-venv/bin/pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify isolated upgrade harness contracts
        run: python3 tests/software_release_125_harness_tests.py
      - name: Build candidate UPDATE from exact commit
        if: steps.version.outputs.run_gate == 'true'
        run: python3 tools/build.py --commit "$GITHUB_SHA"
      - name: Materialize immutable published v1.25 baseline
        if: steps.version.outputs.run_gate == 'true'
        run: |
          mkdir -p test-runtime/released-1.25.0
          curl --fail --location --proto '=https' --tlsv1.2             --output /tmp/CajunWebPro-1.25.0-COMPLETE-UPLOAD.zip             https://github.com/afterburn25/Cajun_Web/releases/download/v1.25.0/CajunWebPro-1.25.0-COMPLETE-UPLOAD.zip
          echo "bebe9a62e36a7b1898baa95babd4f03b2e438a69b48ab42eedcda0f9dd443e39  /tmp/CajunWebPro-1.25.0-COMPLETE-UPLOAD.zip" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          source=Path('/tmp/CajunWebPro-1.25.0-COMPLETE-UPLOAD.zip')
          target=Path('test-runtime/released-1.25.0')
          with zipfile.ZipFile(source) as z:
              if z.testzip() is not None:
                  raise SystemExit('Published v1.25 baseline ZIP is corrupt')
              names=z.namelist()
              if len(names)!=len(set(n.casefold() for n in names)):
                  raise SystemExit('Published v1.25 baseline contains duplicate/case-colliding paths')
              for name in names:
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '\\' in name or ':' in name:
                      raise SystemExit('Unsafe published baseline path: '+name)
              z.extractall(target)
          if not (target/'install.php').is_file():
              raise SystemExit('Published v1.25 COMPLETE package is not direct-extract')
          PY
      - name: Exercise published v1.25 update and recovery
        if: steps.version.outputs.run_gate == 'true'
        env:
          CWP_TEST_PORT: ${{ job.services.mariadb.ports[3306] }}
          PYTHONPATH: tests
        run: /tmp/cwp-release125-venv/bin/python tests/software_release_125_upgrade.py
      - name: Upload non-secret release-gate evidence
        if: always() && steps.version.outputs.run_gate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: software-published-125-upgrade-php${{ matrix.php }}-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/software-release125-upgrade.json
            qa/native-environment-results.json
            qa/software-release125-progress.json
            qa/software-release125-*.log
            qa/organized-software-1.25*.json
          retention-days: 14
          if-no-files-found: warn
