name: Native assigned-package document roots checks
on:
  push:
    branches: [main, codex/twentyi-document-roots-observations]
    paths: ['site/app/providers/**', 'site/admin/**', 'foundation/twentyi-inventory/**', 'foundation/twentyi-inventory-reader/**', 'tests/twentyi-inventory-reader/**', 'foundation/twentyi/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'foundation/twentyi-document-roots/**', 'site/includes/foundation/twentyi-document-roots/**', 'tests/document_roots_contract.php', 'tests/document_roots_transport.php', 'tests/provider_document_roots_native.php', 'tests/provider_document_roots_cases.py', '.github/workflows/provider-document-roots.yml', 'foundation/**', 'site/app/**', 'site/includes/**', 'site/config/**', 'tests/subdomain_add_views.php', 'tests/subdomain_add_contract.php', 'tests/provider_subdomain_add_native.php', 'tests/twentyi-operations/**', 'tests/invitations/Dockerfile', 'tests/subdomain_requests_document.php', 'tests/subdomain_requests_storage.php', 'tests/subdomain_requests_contract.php', 'tests/subdomain_requests_views.php', 'tests/provider_subdomain_requests_native.php']
  pull_request:
    paths: ['site/app/providers/**', 'site/admin/**', 'foundation/twentyi-inventory/**', 'foundation/twentyi-inventory-reader/**', 'tests/twentyi-inventory-reader/**', 'foundation/twentyi/**', 'site/database/**', 'site/includes/layout/provider_services.php', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'foundation/twentyi-document-roots/**', 'site/includes/foundation/twentyi-document-roots/**', 'tests/document_roots_contract.php', 'tests/document_roots_transport.php', 'tests/provider_document_roots_native.php', 'tests/provider_document_roots_cases.py', '.github/workflows/provider-document-roots.yml', 'foundation/**', 'site/app/**', 'site/includes/**', 'site/config/**', 'tests/subdomain_add_views.php', 'tests/subdomain_add_contract.php', 'tests/provider_subdomain_add_native.php', 'tests/twentyi-operations/**', 'tests/invitations/Dockerfile', 'tests/subdomain_requests_document.php', 'tests/subdomain_requests_storage.php', 'tests/subdomain_requests_contract.php', 'tests/subdomain_requests_views.php', 'tests/provider_subdomain_requests_native.php']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: document-roots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native-history:
    name: Assigned package document roots ${{ matrix.php }} and ${{ matrix.database.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database:
          - {image: 'mariadb:10.11', label: 'mariadb-10.11'}
          - {image: 'mysql:8.4', label: 'mysql-8.4'}
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify generated deployment inventory and documentation
        run: |
          PYTHONPATH=tools python -B -c 'import build; build.generated(False)'
          python -B tools/check_docs.py
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-inventory-test -f tests/invitations/Dockerfile tests/invitations
      - name: Allow isolated MySQL audit-failure fixture triggers
        if: matrix.database.label == 'mysql-8.4'
        run: docker exec -e MYSQL_PWD=synthetic-root-only ${{ job.services.database.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Native document root sharing and recovery tests
        run: |
          mkdir -p qa
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-inventory-test sh -ec '
              for source in site/app/providers/*.php site/database/schema/provider_document_roots_schema.php site/admin/views/provider_document_roots.php site/admin/controllers/providers.php tests/provider_document_roots_native.php; do php -l "$source"; done
              php tests/document_roots_contract.php > qa/document-roots-document-results.json
              php -n tests/document_roots_contract.php > qa/document-roots-document-no-ini-results.json
              php tests/document_roots_transport.php > qa/document-roots-transport-results.json
              php -n tests/document_roots_transport.php > qa/document-roots-transport-no-ini-results.json
              php tests/provider_document_roots_native.php
              php tests/twentyi-operations/subdomains.php > qa/subdomain-add-contract-default.json
              php -n tests/twentyi-operations/subdomains.php > qa/subdomain-add-contract-minimal.json
              php tests/subdomain_add_contract.php > qa/subdomain-add-service-default.json
              php -n tests/subdomain_add_contract.php > qa/subdomain-add-service-minimal.json
              php tests/subdomain_add_views.php qa/subdomain-add-views-default.json
              php -n tests/subdomain_add_views.php qa/subdomain-add-views-minimal.json
              CWP_TEST_SUBDOMAIN_ADD=1 php tests/provider_subdomain_add_native.php
              php tests/subdomain_requests_document.php > qa/subdomain-requests-document-default-results.json
              php -n tests/subdomain_requests_document.php > qa/subdomain-requests-document-minimal-results.json
              php tests/subdomain_requests_storage.php > qa/subdomain-requests-storage-default-results.json
              php -n tests/subdomain_requests_storage.php > qa/subdomain-requests-storage-minimal-results.json
              php tests/subdomain_requests_contract.php > qa/subdomain-requests-service-default-results.json
              php -n tests/subdomain_requests_contract.php > qa/subdomain-requests-service-minimal-results.json
              php tests/subdomain_requests_views.php > qa/subdomain-requests-views-default-results.json
              php -n tests/subdomain_requests_views.php > qa/subdomain-requests-views-minimal-results.json
              CWP_TEST_SUBDOMAIN_REQUESTS=1 php tests/provider_subdomain_requests_native.php
              php tests/provider_package_php_native.php
              php tests/domain_expiry_native.php
              php tests/provider_schedule_native.php
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-roots-${{ matrix.php }}-${{ matrix.database.label }}-${{ github.sha }}
          path: |
            qa/provider-document-roots-native-results.json
            qa/subdomain-add-contract-default.json
            qa/subdomain-add-contract-minimal.json
            qa/subdomain-add-service-default.json
            qa/subdomain-add-service-minimal.json
            qa/subdomain-add-views-default.json
            qa/subdomain-add-views-minimal.json
            qa/provider-subdomain-add-native-results.json
            qa/subdomain-requests-document-default-results.json
            qa/subdomain-requests-document-minimal-results.json
            qa/subdomain-requests-storage-default-results.json
            qa/subdomain-requests-storage-minimal-results.json
            qa/subdomain-requests-service-default-results.json
            qa/subdomain-requests-service-minimal-results.json
            qa/subdomain-requests-views-default-results.json
            qa/subdomain-requests-views-minimal-results.json
            qa/provider-subdomain-requests-native-results.json
            qa/document-roots-document-results.json
            qa/document-roots-document-no-ini-results.json
            qa/document-roots-transport-results.json
            qa/document-roots-transport-no-ini-results.json
            qa/provider-package-php-native-results.json
            qa/domain-expiry-native-results.json
            qa/provider-schedule-native-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verification scope
        if: always()
        run: |
          echo 'Exact assigned-package document-roots map read, current explicit package assignment, credential-bound observation, owner-approved sharing, revocation, retained-history recovery and actual PHP forms. Disposable MariaDB/MySQL and synthetic provider only; no real API, browser or deployment.' >> "$GITHUB_STEP_SUMMARY"
