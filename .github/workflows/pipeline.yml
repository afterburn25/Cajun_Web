name: Lead-pipeline model checks

on:
  pull_request:
    paths: ['foundation/pipeline/**', 'tests/pipeline/**', '.github/workflows/pipeline.yml']
  push:
    branches: [main, 'devin/non20i-*']
    paths: ['foundation/pipeline/**', 'tests/pipeline/**', '.github/workflows/pipeline.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    name: Pipeline checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and pipeline checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/pipeline/*.php tests/pipeline/*.php; do php -l "$source"; done
            php tests/pipeline/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated pipeline-model checks only. No persistence, permissions, drag UI or application integration is tested by this job.' >> "$GITHUB_STEP_SUMMARY"
