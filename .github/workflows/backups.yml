name: Backup/restore contract checks

on:
  pull_request:
    paths: ['foundation/backups/**', 'tests/backups/**', 'site/app/backups/**', 'site/database/schema/backups_schema.php', 'site/database/migrations/backups_migrate.php', 'site/admin/controllers/backups.php', 'site/includes/layout/backups.php', 'tests/backups_native.php', 'tests/backups_cases.py', '.github/workflows/backups.yml']
  push:
    branches: [main, 'devin/non20i-*']
    paths: ['foundation/backups/**', 'tests/backups/**', 'site/app/backups/**', 'site/database/schema/backups_schema.php', 'site/database/migrations/backups_migrate.php', 'site/admin/controllers/backups.php', 'site/includes/layout/backups.php', 'tests/backups_native.php', 'tests/backups_cases.py', '.github/workflows/backups.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backups-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    name: Backup checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare a test PHP image with the ZIP extension
        run: |
          docker run --name cwp-backup-php "php:${{ matrix.php }}-cli" sh -ec 'apt-get update -qq && apt-get install -y -qq libzip-dev && docker-php-ext-install -j2 zip && php -m | grep -Fx zip'
          docker commit cwp-backup-php cwp-backup-php:${{ matrix.php }} >/dev/null
          docker rm cwp-backup-php >/dev/null
      - name: Syntax and backup checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "cwp-backup-php:${{ matrix.php }}" sh -ec '
            for source in foundation/backups/*.php tests/backups/*.php; do php -l "$source"; done
            php tests/backups/run.php
            php tests/backups/archive_run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Manifest/restore-plan contract checks plus the archive-adapter filesystem suite on synthetic fixture trees. Database restore and application integration are covered by the native and browser lanes.' >> "$GITHUB_STEP_SUMMARY"
