name: Backup/restore contract checks

on:
  pull_request:
    paths: ['foundation/backups/**', 'tests/backups/**', '.github/workflows/backups.yml']
  push:
    branches: [main, 'devin/non20i-*']
    paths: ['foundation/backups/**', 'tests/backups/**', '.github/workflows/backups.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backups-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Backup checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and backup checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/backups/*.php tests/backups/*.php; do php -l "$source"; done
            php tests/backups/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated backup-manifest/restore-plan checks only. No archives, filesystem writes, database restore or application integration is tested by this job.' >> "$GITHUB_STEP_SUMMARY"
