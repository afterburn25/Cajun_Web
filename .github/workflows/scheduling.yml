name: Scheduling checks

on:
  pull_request:
  push:
    branches: [main, devin/consultation-scheduling]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduling:
    name: Scheduling PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and scheduling decisions using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/scheduling/*.php tests/scheduling/*.php; do php -l "$source"; done
            php tests/scheduling/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Scheduling contract unit checks only. Forms, persistence, admin workflow, confirmations, mail, calendar-provider and application integration remain untested by this job.' >> "$GITHUB_STEP_SUMMARY"
