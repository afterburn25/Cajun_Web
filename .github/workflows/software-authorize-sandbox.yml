name: Software Authorize.net real sandbox acceptance
on:
  workflow_dispatch:
    inputs:
      confirm_sandbox_only:
        description: 'Run sandbox-only Accept.js / transaction / ARB integration checks'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  authorize-sandbox:
    if: ${{ inputs.confirm_sandbox_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANET_SANDBOX_API_LOGIN_ID: ${{ secrets.ANET_SANDBOX_API_LOGIN_ID }}
      ANET_SANDBOX_TRANSACTION_KEY: ${{ secrets.ANET_SANDBOX_TRANSACTION_KEY }}
      ANET_SANDBOX_PUBLIC_CLIENT_KEY: ${{ secrets.ANET_SANDBOX_PUBLIC_CLIENT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce sandbox-only source contract
        run: |
          python3 -m py_compile tests/software_anet_sandbox_acceptance.py
          ! grep -F 'https://api.authorize.net' tests/software_anet_sandbox_acceptance.py
          ! grep -F 'https://js.authorize.net' tests/software_anet_sandbox_acceptance.py
          grep -F 'https://apitest.authorize.net/xml/v1/request.api' tests/software_anet_sandbox_acceptance.py
          grep -F 'https://jstest.authorize.net/v1/Accept.js' tests/software_anet_sandbox_acceptance.py
      - name: Require separately stored sandbox credentials
        run: |
          test -n "$ANET_SANDBOX_API_LOGIN_ID" || { echo 'Missing ANET_SANDBOX_API_LOGIN_ID'; exit 2; }
          test -n "$ANET_SANDBOX_TRANSACTION_KEY" || { echo 'Missing ANET_SANDBOX_TRANSACTION_KEY'; exit 2; }
          test -n "$ANET_SANDBOX_PUBLIC_CLIENT_KEY" || { echo 'Missing ANET_SANDBOX_PUBLIC_CLIENT_KEY'; exit 2; }
      - name: Install isolated browser dependencies
        run: |
          python3 -m venv .sandbox-venv
          .sandbox-venv/bin/pip install --disable-pip-version-check requests playwright
          .sandbox-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise real Authorize.net sandbox only
        run: .sandbox-venv/bin/python tests/software_anet_sandbox_acceptance.py
      - name: Upload non-secret sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-anet-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/software-anet-sandbox-acceptance.json
          retention-days: 14
          if-no-files-found: warn
