name: SSH access-model checks

on:
  pull_request:
  push:
    branches: [main, devin/ssh-access-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssh-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Access-model checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and access-model checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/ssh-access/*.php tests/ssh-access/*.php; do php -l "$source"; done
            php tests/ssh-access/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated access-model checks only. No SSH transport, gateway, database, installer or application integration is tested by this job; A-10 remains Architecture/security validation pending.' >> "$GITHUB_STEP_SUMMARY"
