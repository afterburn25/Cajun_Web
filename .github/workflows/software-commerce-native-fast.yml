name: Software commerce fast native database checks
on:
  push:
    branches:
      - feature/software-license-commerce-20261025
    paths:
      - 'tests/software_commerce_native.php'
      - 'site/app/billing/software_*.php'
      - 'site/app/billing/authorize_net_*.php'
      - 'site/app/licenses/software_*.php'
      - 'site/database/schema/software_commerce_schema.php'
      - 'site/database/migrations/software_commerce_migrate.php'
      - '.github/workflows/software-commerce-native-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root-only
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Bind assigned database port
        run: echo "CWP_TEST_PORT=${{ job.services.mariadb.ports[3306] }}" >> "$GITHUB_ENV"
      - name: Install PHP runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-zip php-curl php-mbstring
      - name: Write isolated test-only config
        run: |
          mkdir -p test-runtime/software-private qa
          php -r '$storage=realpath("test-runtime/software-private");$cfg=["site_url"=>"http://127.0.0.1:8091/existing","storage"=>$storage,"key"=>str_repeat("a",64),"db"=>["host"=>getenv("CWP_TEST_HOST"),"port"=>(int)getenv("CWP_TEST_PORT"),"name"=>"cwp_test","user"=>getenv("CWP_TEST_USER"),"pass"=>getenv("CWP_TEST_PASSWORD"),"prefix"=>"swci_"]];file_put_contents("test-runtime/config-fixture.php","<?php return ".var_export($cfg,true).";");'
      - name: Run full software commerce native suite
        run: php tests/software_commerce_native.php
      - name: Verify shipping source remained unchanged
        if: always()
        run: git diff --exit-code -- site foundation
