            {"setup": "${{ steps.setup.outcome }}", "input": "${{ steps.input.outcome }}", "test": "${{ steps.test.outcome }}", "mutation": "${{ steps.mutation.outcome }}"}
        run: python3 tools/acceptance_artifacts.py seal --lane recovery
