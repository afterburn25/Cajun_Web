        if: always()
        env:
          CWP_CHECKPOINT_ONLY: ${{ inputs.checkpoint_only && 'true' || 'false' }}
          CWP_JOB_BINDINGS: >-
            {"build": {"result": "${{ needs.build.result }}", "artifact_id": "${{ needs.build.outputs.artifact_id }}", "sha256": "${{ needs.build.outputs.sha256 }}", "input_sha256": "${{ needs.build.outputs.input_sha256 }}"}, "native-browser": {"result": "${{ needs.native-and-browser.result }}", "artifact_id": "${{ needs.native-and-browser.outputs.artifact_id }}", "sha256": "${{ needs.native-and-browser.outputs.sha256 }}", "checkpoint_id": "${{ needs.native-and-browser.outputs.checkpoint_id }}", "checkpoint_digest": "${{ needs.native-and-browser.outputs.checkpoint_digest }}"}, "recovery": {"result": "${{ needs.recovery.result }}", "artifact_id": "${{ needs.recovery.outputs.artifact_id }}", "sha256": "${{ needs.recovery.outputs.sha256 }}"}, "apache": {"result": "${{ needs.apache.result }}", "artifact_id": "${{ needs.apache.outputs.artifact_id }}", "sha256": "${{ needs.apache.outputs.sha256 }}"}}
        run: |
          mkdir -p qa
          python3 tools/acceptance_artifacts.py aggregate
      - name: Preserve final or deliberately limited checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ inputs.checkpoint_only && 'checkpoint' || 'acceptance' }}-${{ github.sha }}${{ github.run_attempt != 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: |
            qa/
            dist/
          retention-days: 14
          if-no-files-found: error
