          path: |
            .acceptance/partition/partition.zip
            .acceptance/partition/partition.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  acceptance:
    needs: [build, native-and-browser, recovery, apache]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
