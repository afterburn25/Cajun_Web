        if: always() && steps.seal.outcome == 'success'
        id: partition_upload
        uses: actions/upload-artifact@v4
        with:
          name: application-partition-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .acceptance/partition/partition.zip
            .acceptance/partition/partition.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
