          "$PHP_BINARY" tests/domain_expiry_reader.php > qa/domain-expiry-reader-integrated-results.json
          "$PHP_BINARY" tests/domain_expiry_native.php
          "$PHP_BINARY" tests/twentyi-package-php/run.php > qa/package-php-document-results.json
