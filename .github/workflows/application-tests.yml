          test -x "$PHP_BINARY"
          printf 'PHP_BINARY=%s\n' "$PHP_BINARY" >> "$GITHUB_ENV"
          "$PHP_BINARY" -v
          "$PHP_BINARY" -m
          python3 tests/acceptance_environment.py --lane build
      - name: Offline transfer, provenance and failure regressions
        id: helpers
        run: python3 tests/acceptance_artifacts_test.py --report qa/parallel-helper-tests.json
      - name: Exact source, installer inventory and one package build
        id: build
        run: |
          set -o pipefail
          python3 tools/build.py --commit "$GITHUB_SHA" | tee qa/build-results.txt
          python3 tests/build_guards.py
          python3 -B tests/combined_source_composition_test.py | tee -a qa/build-results.txt
          python3 -B tests/browser_suite_orchestration_contract.py | tee -a qa/build-results.txt
      - name: Prepare only pristine public historical fixtures
        id: fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          : > qa/legacy-preparation.txt
          for attempt in 1 2 3; do
            if python3 tests/prepare_legacy.py 2>&1 | tee -a qa/legacy-preparation.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            printf 'Historical fixture preparation attempt %s failed; retrying after bounded delay.\n' "$attempt" | tee -a qa/legacy-preparation.txt
            sleep "$((attempt * 10))"
          done
      - name: Seal exact build and public inputs
        id: inputs
        run: python3 tools/acceptance_artifacts.py pack-inputs
      - name: Upload immutable build inputs
        id: input_upload
        uses: actions/upload-artifact@v4
        with:
          name: application-inputs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .acceptance/inputs/inputs.zip
            .acceptance/inputs/inputs.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Verify shipping source after this job, including failure
        if: always()
        id: mutation
        run: python3 tools/acceptance_artifacts.py guard
      - name: Preserve this job's exact evidence partition
        if: always()
        id: seal
        env:
          CWP_STEP_OUTCOMES: >-
            {"setup": "${{ steps.setup.outcome }}", "helpers": "${{ steps.helpers.outcome }}", "build": "${{ steps.build.outcome }}", "fixtures": "${{ steps.fixtures.outcome }}", "inputs": "${{ steps.inputs.outcome }}", "mutation": "${{ steps.mutation.outcome }}"}
        run: python3 tools/acceptance_artifacts.py seal --lane build
      - name: Upload immutable evidence partition
        if: always() && steps.seal.outcome == 'success'
        id: partition_upload
        uses: actions/upload-artifact@v4
        with:
          name: application-partition-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .acceptance/partition/partition.zip
            .acceptance/partition/partition.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  native-and-browser:
    needs: build
    runs-on: ubuntu-24.04
    # Original run38909577278 exhausted105m; run39024070818 later exhausted180m
    # during the final scheduler flow, with requests completing until the job cap.
    # Preserve every assertion, request/browser/provider limit and native-to-browser state.
    timeout-minutes: 240
    outputs:
      artifact_id: ${{ steps.partition_upload.outputs.artifact-id }}
      sha256: ${{ steps.seal.outputs.sha256 }}
      checkpoint_id: ${{ steps.checkpoint_upload.outputs.artifact-id }}
      checkpoint_digest: ${{ steps.checkpoint_upload.outputs.artifact-digest }}
    services:
      mariadb:
        image: ${{ inputs.database == 'mysql-8.4' && 'mysql:8.4' || 'mariadb:10.11' }}
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: isolated-ci-root-only
          MYSQL_DATABASE: cwp_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
        ports: ['3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      checkout_mariadb:
        image: ${{ inputs.database == 'mysql-8.4' && 'mysql:8.4' || 'mariadb:10.11' }}
        env:
          MARIADB_ROOT_PASSWORD: isolated-checkout-root-only
          MARIADB_DATABASE: cwp_checkout_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: isolated-checkout-root-only
          MYSQL_DATABASE: cwp_checkout_test
          MYSQL_USER: cwp_test
          MYSQL_PASSWORD: local-ci-only
        ports: ['43319:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
      CWP_TEST_HOSTING_PAYMENT_FOREIGN_DATABASE: cwp_hpay_foreign
      CWP_INPUT_SHA256: ${{ needs.build.outputs.input_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare isolated runtime and evidence directory
        id: setup
        env:
          CWP_ASSIGNED_PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          mkdir -p qa
          printf 'CWP_TEST_PORT=%s\n' "$CWP_ASSIGNED_PORT" >> "$GITHUB_ENV"
          export CWP_TEST_PORT="$CWP_ASSIGNED_PORT"
          sudo python3 - <<'CWP_UBUNTU_MIRRORS'
          from pathlib import Path
          import hashlib, json, os, re, secrets, stat, subprocess, sys

          diagnostic = {'schema': 1, 'passed': False}
          def retain_diagnostic(reason):
              diagnostic['failure'] = reason
              evidence = Path.cwd() / 'qa' / 'ubuntu-apt-source-preflight.json'
              evidence.parent.mkdir(parents=True, exist_ok=True)
              evidence.write_text(json.dumps(diagnostic, indent=2) + '\n', encoding='utf-8')

          def fail(reason):
              try:
                  retain_diagnostic(reason)
              except Exception:
                  pass
              raise SystemExit('Ubuntu APT source preparation: ' + reason)

          def retain_unhandled(kind, value, traceback):
              try:
                  retain_diagnostic('unhandled setup exception: ' + kind.__name__)
              finally:
                  sys.__excepthook__(kind, value, traceback)

          sys.excepthook = retain_unhandled

          def fingerprint(value):
              return (value.st_dev, value.st_ino, value.st_mode, value.st_uid, value.st_gid,
                      value.st_size, value.st_mtime_ns, value.st_ctime_ns)

          def directory_identity(value):
              return (value.st_dev, value.st_ino, stat.S_IFMT(value.st_mode), stat.S_IMODE(value.st_mode),
                      value.st_uid, value.st_gid)

          def checked_read(path, limit, label):
              parent = path.parent.lstat()
              if not stat.S_ISDIR(parent.st_mode) or parent.st_uid != 0 or parent.st_gid != 0 or parent.st_mode & 0o022:
                  fail('unsafe ' + label + ' directory')
              before = path.lstat()
              if (not stat.S_ISREG(before.st_mode) or before.st_nlink != 1
                      or before.st_uid != 0 or before.st_gid != 0
                      or before.st_mode & 0o022 or not 0 < before.st_size <= limit):
                  fail('unsafe ' + label + ' metadata')
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                  if fingerprint(os.fstat(stream.fileno())) != fingerprint(before):
                      fail(label + ' changed while opening')
                  data = stream.read(limit + 1)
                  if len(data) != before.st_size or fingerprint(os.fstat(stream.fileno())) != fingerprint(before):
                      fail(label + ' changed while reading')
              return data, before, parent

          def replace_checked(path, original, before, parent, changed, label):
              temporary = '.' + path.name + '-' + secrets.token_hex(16)
              try:
                  directory_fd = os.open(path.parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              except OSError:
                  fail(label + ' directory could not be opened safely')
              try:
                  if directory_identity(os.fstat(directory_fd)) != directory_identity(parent):
                      fail(label + ' directory changed while opening')
                  descriptor = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                       0o600, dir_fd=directory_fd)
                  with os.fdopen(descriptor, 'wb') as stream:
                      os.fchown(stream.fileno(), before.st_uid, before.st_gid)
                      os.fchmod(stream.fileno(), stat.S_IMODE(before.st_mode))
                      stream.write(changed)
                      stream.flush()
                      os.fsync(stream.fileno())
                  current_fd = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=directory_fd)
                  with os.fdopen(current_fd, 'rb') as current_stream:
                      metadata = os.fstat(current_stream.fileno())
                      current = current_stream.read(max(len(original), len(changed), 4096) + 1)
                      final_metadata = os.fstat(current_stream.fileno())
                  if (current != original or fingerprint(metadata) != fingerprint(before)
                          or fingerprint(final_metadata) != fingerprint(before)
                          or directory_identity(os.fstat(directory_fd)) != directory_identity(parent)):
                      fail(label + ' changed before replacement')
                  os.replace(temporary, path.name, src_dir_fd=directory_fd, dst_dir_fd=directory_fd)
                  temporary = None
                  secured_parent = os.fstat(directory_fd)
                  if (not stat.S_ISDIR(secured_parent.st_mode) or secured_parent.st_uid != 0
                          or secured_parent.st_gid != 0 or secured_parent.st_mode & 0o022):
                      fail(label + ' directory changed during replacement')
                  os.fsync(directory_fd)
                  final_fd = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=directory_fd)
                  with os.fdopen(final_fd, 'rb') as final_stream:
                      final = os.fstat(final_stream.fileno())
                      actual = final_stream.read(max(len(changed), 4096) + 1)
                  if (actual != changed or final.st_uid != before.st_uid or final.st_gid != before.st_gid
                          or stat.S_IMODE(final.st_mode) != stat.S_IMODE(before.st_mode)):
                      fail(label + ' replacement was not retained')
              finally:
                  if temporary is not None:
                      try:
                          os.unlink(temporary, dir_fd=directory_fd)
                      except FileNotFoundError:
                          pass
                  os.close(directory_fd)

          def write_new(path, data, label):
              parent = path.parent.lstat()
              if (not stat.S_ISDIR(parent.st_mode) or parent.st_uid != 0 or parent.st_gid != 0
                      or parent.st_mode & 0o022 or os.path.lexists(path)):
                  fail('unsafe new ' + label + ' path')
              directory_fd = os.open(path.parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  if directory_identity(os.fstat(directory_fd)) != directory_identity(parent):
                      fail(label + ' directory changed while opening')
                  descriptor = os.open(path.name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                       0o644, dir_fd=directory_fd)
                  with os.fdopen(descriptor, 'wb') as stream:
                      os.fchown(stream.fileno(), 0, 0)
                      os.fchmod(stream.fileno(), 0o644)
                      stream.write(data)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.fsync(directory_fd)
                  final_fd = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=directory_fd)
                  with os.fdopen(final_fd, 'rb') as final_stream:
                      metadata = os.fstat(final_stream.fileno())
                      actual = final_stream.read(max(len(data), 4096) + 1)
                  if (actual != data or metadata.st_nlink != 1
                          or (metadata.st_uid, metadata.st_gid, stat.S_IMODE(metadata.st_mode)) != (0, 0, 0o644)):
                      fail(label + ' creation was not retained')
              finally:
                  os.close(directory_fd)

          cloud_init = subprocess.run(
