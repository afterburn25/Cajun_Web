name: Software commerce native database checks
on:
  push:
    branches: [feature/software-license-commerce-20261025]
    paths:
      - 'tests/software_commerce_native.php'
      - 'site/app/billing/software_payment_review.php'
      - 'site/app/billing/catalog.php'
      - 'site/app/billing/software_orders.php'
      - 'site/app/licenses/software_grants.php'
      - 'site/app/licenses/software_products.php'
      - 'site/app/licenses/software_asset_access.php'
      - 'site/app/licenses/software_assets.php'
      - 'site/app/licenses/software_notices.php'
      - 'site/app/licenses/software_usage.php'
      - 'site/app/licenses/software_fulfill.php'
      - 'site/app/billing/software_subscription_settle.php'
      - 'site/app/billing/software_subscriptions.php'
      - 'site/app/billing/software_subscription_enroll.php'
      - 'site/app/billing/software_subscription_cancel.php'
      - 'site/app/billing/software_charge.php'
      - 'site/app/billing/software_charge_guard.php'
      - 'site/app/billing/authorize_net_contract.php'
      - 'site/app/billing/authorize_net_webhooks.php'
      - 'site/database/schema/software_commerce_schema.php'
      - 'site/database/migrations/software_commerce_migrate.php'
      - '.github/workflows/software-commerce-native.yml'
  pull_request:
    branches: [feature/software-license-commerce-20261025]
    paths:
      - 'tests/software_commerce_native.php'
      - 'site/app/billing/software_payment_review.php'
      - 'site/app/billing/catalog.php'
      - 'site/app/billing/software_orders.php'
      - 'site/app/licenses/software_grants.php'
      - 'site/app/licenses/software_products.php'
      - 'site/app/licenses/software_asset_access.php'
      - 'site/app/licenses/software_assets.php'
      - 'site/app/licenses/software_notices.php'
      - 'site/app/licenses/software_usage.php'
      - 'site/app/licenses/software_fulfill.php'
      - 'site/app/billing/software_subscription_settle.php'
      - 'site/app/billing/software_subscriptions.php'
      - 'site/app/billing/software_subscription_enroll.php'
      - 'site/app/billing/software_subscription_cancel.php'
      - 'site/app/billing/software_charge.php'
      - 'site/app/billing/software_charge_guard.php'
      - 'site/app/billing/authorize_net_contract.php'
      - 'site/app/billing/authorize_net_webhooks.php'
      - 'site/database/schema/software_commerce_schema.php'
      - 'site/database/migrations/software_commerce_migrate.php'
      - '.github/workflows/software-commerce-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: 3306
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-mysql php8.3-zip php8.3-curl php8.3-mbstring
      - name: Write isolated test-only config
        run: |
          mkdir -p test-runtime/software-private qa
          php8.3 -r '$storage=realpath("test-runtime/software-private");$cfg=["site_url"=>"http://127.0.0.1:8091/existing","storage"=>$storage,"key"=>str_repeat("a",64),"db"=>["host"=>getenv("CWP_TEST_HOST"),"port"=>(int)getenv("CWP_TEST_PORT"),"name"=>"cwp_test","user"=>getenv("CWP_TEST_USER"),"pass"=>getenv("CWP_TEST_PASSWORD"),"prefix"=>"swci_"]];file_put_contents("test-runtime/config-fixture.php","<?php return ".var_export($cfg,true).";");'
      - name: Run native licensing and purchase cases
        run: php8.3 tests/software_commerce_native.php
      - name: Source unchanged
        if: always()
        run: git diff --exit-code -- site foundation
