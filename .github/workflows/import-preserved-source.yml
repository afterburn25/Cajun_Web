name: Import preserved 1.1 source
on:
  push:
    branches: [codex/finish-1.1.0]
    paths: [.github/workflows/import-preserved-source.yml]
permissions:
  contents: write
concurrency:
  group: cwp-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-1.1.0
      - name: Restore only fingerprinted source and original public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,urllib.request,json,base64,lzma,hashlib,pathlib,re
          ids=['444e2c7d010d2525e35e79a495587141f52c67b8','6af033ce509088fca34a0fdb833aa26c5835b979','b286b3b6600b9db82b16f8a7a94f3244250bceb2','fc2880098a1bcf3d223ef039fcf70c1480c99fa8','dafc8a5b87d2172bd067c19e83bbe10d4e2b3645','9e1f181b0bfb029d5de7442c233932096ea14bc6','cd3f54b46c687cd89c52d0372c690e2ba337727c','796c1a0433a9507039c936951ea4e818003bbb66','cc4b9f306b44e3456b003065445ecdeae2780bba']
          parts=[]
          for sha in ids:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=25) as res:obj=json.load(res)
              b=base64.b64decode(obj['content']);assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha;parts.append(b)
          dec=lzma.LZMADecompressor(memlimit=134217728);data=dec.decompress(b''.join(parts),max_length=16000000)
          assert dec.eof and not dec.unused_data
          expected='aa4aa18e36c785b32c9948f1f8c3fe08fd577054d3620c8ba1c728a7248c701d'
          assert hashlib.sha256(data).hexdigest()==expected
          obj=json.loads(data);assert len(obj['files'])==28 and len(obj['origins'])==16
          recovered={};ledger={}
          for group,records in obj.items():
              for name,record in records.items():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and all(x not in ['.','..','.git'] for x in p.parts)
                  assert name.startswith(('site/','tests/','tools/')) and not any(x in p.parts for x in ['config.php','storage','.env'])
                  if group=='origins' and isinstance(record,str):
                      assert re.fullmatch('[a-f0-9]{64}',record), 'Invalid original fingerprint'
                      assert name.startswith('site/assets/')
                      record={'sha256':record,'url':'https://cajunwebpro.com/'+name.removeprefix('site/')}
                  assert isinstance(record,dict), (name,type(record).__name__)
                  if group=='files':
                      if 'text' in record:b=record['text'].encode('utf-8')
                      elif 'base64' in record:b=base64.b64decode(record['base64'],validate=True)
                      else:raise ValueError('Unknown binary representation: '+name)
                  else:
                      url=record['url'];assert url.startswith('https://cajunwebpro.com/assets/')
                      with urllib.request.urlopen(url,timeout=30) as res:
                          assert res.url.startswith('https://cajunwebpro.com/'),'Unexpected origin redirect'
                          b=res.read(2000001)
                      assert len(b)<=2000000,'Oversized origin asset'
                  assert hashlib.sha256(b).hexdigest()==record['sha256'], 'Fingerprint mismatch: '+name
                  if name.endswith(('.php','.py','.js','.css')):
                      text=b.decode('utf-8')
                      assert not re.search(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|AKIA[A-Z0-9]{16}|sk_live_[A-Za-z0-9]{20,}',text),'Secret-shaped content blocked'
                  target=pathlib.Path(name);assert not target.exists(),'Preserving existing file: '+name
                  recovered[name]=b;ledger[name]={'bytes':len(b),'sha256':record['sha256'],'source':'preserved-fragment' if group=='files' else 'fingerprinted-public-asset'}
                  print('VERIFIED',name,len(b),record['sha256'])
          for name,b in recovered.items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          pathlib.Path('docs/SOURCE_RECOVERY_2026-10-13.json').write_text(json.dumps({'payload_sha256':expected,'fragments':ids,'files':ledger,'status':'Recovered source only; application acceptance pending.'},indent=2)+'\n')
          count=sum(n.startswith('site/') for n in recovered)
          note='\n## 2026-10-13 — Source recovery checkpoint\n\nRecovered '+str(count)+' actual website files plus native/HTTP tests and a build tool from the nine preserved source fragments. Original external assets were fetched only at the recorded public paths and checked against recorded SHA-256 values. Executable source is now under `site/` on `codex/finish-1.1.0`. This supersedes the older no-source-in-Git blocker on this branch, NOT the unverified runtime or release claims. No production files, database, mail or payments were changed. Review `docs/SOURCE_RECOVERY_2026-10-13.json`; run native integration and authorization tests next. No 1.1.0 release is declared by source recovery.\n'
          for name in ['PROJECT_STATUS.md','SESSION_HANDOFF.md','CHANGELOG.md']:
              p=pathlib.Path(name);s=p.read_text();head,sep,rest=s.partition('\n');p.write_text(head+'\n'+note+'\n'+rest)
          p=pathlib.Path('docs/SESSION_LOG.md');p.write_text(p.read_text()+note+'\nStarting commit: '+os.environ['GITHUB_SHA']+'. Recovery verified payload hashes, individual file hashes, safe paths and absence of common secret formats. The first import attempt rejected the origins record format before writing files; corrected to its actual path-to-fingerprint map. No application code was executed by the recovery job.\n')
          print('RECOVERED_SITE_FILES',count,'TOTAL',len(recovered))
      - name: Commit recovered files to the development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site tests tools/build.py docs/SOURCE_RECOVERY_2026-10-13.json PROJECT_STATUS.md SESSION_HANDOFF.md CHANGELOG.md docs/SESSION_LOG.md
          git commit -m 'source: recover integrated 1.1 draft, exact assets and test/build scripts'
          git push origin HEAD:codex/finish-1.1.0
