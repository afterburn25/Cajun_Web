name: Provider inventory checks
on:
  push:
    branches: [main, devin/twentyi-complete, devin/twentyi-refresh, devin/twentyi-domain-links]
    paths: ['site/app/providers/**', 'site/database/**', 'site/app/staff/**', 'site/includes/auth/**', 'site/portal/**', 'tests/provider_inventory*.php', '.github/workflows/provider-inventory.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-inventory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-inventory:
    name: Provider inventory PHP ${{ matrix.php }} and MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-inventory-test -f tests/invitations/Dockerfile tests/invitations
      - name: Native refresh, observation and link tests
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-inventory-test sh -ec '
              for source in site/app/providers/*.php site/database/schema/provider_inventory_schema.php site/database/migrations/provider_inventory_migrate.php site/includes/layout/provider_services.php tests/provider_inventory*.php; do php -l "$source"; done
              php tests/provider_inventory_native.php
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-inventory-${{ matrix.php }}-${{ github.sha }}
          path: qa/provider-inventory-native-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verification scope
        if: always()
        run: |
          echo 'Native database orchestration only: synthetic DNS/transport fixtures against disposable MariaDB. No real 20i API call, credential, browser or deployment is exercised.' >> "$GITHUB_STEP_SUMMARY"
