name: Remaining prerequisite source acceptance
on:
  push:
    branches: [chatgpt/remaining-prerequisites-20261030]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: remaining-prerequisites-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assemble:
    if: github.ref == 'refs/heads/chatgpt/remaining-prerequisites-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      source: ${{ steps.record.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged original heads and resolved review requests
        env:
          READ_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import importlib.util,json,os,urllib.request
          spec=importlib.util.spec_from_file_location('group','tools/integration/remaining_prerequisites.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/afterburn25/Cajun_Web/'+path,headers={'Authorization':'Bearer '+os.environ['READ_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'CWP-reviewed-merge'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          for number,sha in m.SOURCES:
              if get('pulls/'+str(number))['head']['sha']!=sha:raise SystemExit('Source head advanced: '+str(number))
              states={}
              for page in range(1,11):
                  rows=get('pulls/'+str(number)+'/reviews?per_page=100&page='+str(page))
                  for row in rows:
                      if row['state'] in ('APPROVED','CHANGES_REQUESTED','DISMISSED'):states[row['user']['login']]=row['state']
                  if len(rows)<100:break
              else:raise SystemExit('Incomplete review pagination')
              if 'CHANGES_REQUESTED' in states.values():raise SystemExit('Unresolved change request: '+str(number))
              print('Reviewed source unchanged:',number,sha)
          PY
      - name: Assemble only reviewed source histories
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          git config user.name 'CajunWebPro integration builder'
          git config user.email 'integration-builder@users.noreply.github.com'
          python3 tools/integration/remaining_prerequisites.py
      - name: Record isolated candidate without overwriting concurrent work
        id: record
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64,os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          branch='refs/heads/chatgpt/remaining-prerequisites-20261030'
          if git('ls-remote','origin',branch).split()[0]!=os.environ['EXPECTED_HEAD']:raise SystemExit('Candidate changed')
          if git('ls-remote','origin','refs/heads/main').split()[0]!='5f8efc3db5a8e3c24a1669e7ba1ca25cd9767443':raise SystemExit('Main changed; reconcile it first')
          if git('status','--porcelain'):raise SystemExit('Dirty candidate')
          auth=base64.b64encode(('x-access-token:'+os.environ['PUSH_TOKEN']).encode()).decode()
          env={**os.environ,'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+auth}
          subprocess.run(['git','push','origin','HEAD:'+branch],env=env,check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('source='+git('rev-parse','HEAD')+'\n')
          PY
  model:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.assemble.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and complete lifecycle reports
        env:
          SOURCE: ${{ needs.assemble.outputs.source }}
          PHP_VERSION: ${{ matrix.php }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/integration/remaining_prerequisites.py --verify
          mkdir -p qa/remaining-prerequisites
          docker pull "php:$PHP_VERSION-cli" > qa/remaining-prerequisites/runtime-acquisition.log 2>&1
          docker image inspect "php:$PHP_VERSION-cli" --format '{{json .RepoDigests}}' > qa/remaining-prerequisites/runtime-image.json
          docker run --rm --pull never --network none --user "$(id -u):$(id -g)" -v "$PWD:/workspace:ro" -v "$PWD/qa:/workspace/qa" -w /workspace "php:$PHP_VERSION-cli" sh -ec '
            for source in foundation/vps/*.php tests/vps/*.php; do php -l "$source"; done
            php tests/vps/run.php qa/remaining-prerequisites/default.json
            php -n tests/vps/run.php qa/remaining-prerequisites/minimal.json
          ' > qa/remaining-prerequisites/stdout.log 2> qa/remaining-prerequisites/stderr.log
          test ! -s qa/remaining-prerequisites/stderr.log
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('qa/remaining-prerequisites');reports=[]
          for name in ['default.json','minimal.json']:
              d=json.loads((p/name).read_text())
              assert d['passed'] is True and len(d['checks'])==311 and all(c['passed'] is True for c in d['checks'])
              reports.append({'report':name,'checks':len(d['checks']),'passed':True})
          (p/'results.json').write_text(json.dumps({'passed':True,'source':os.environ['SOURCE'],'php':os.environ['PHP_VERSION'],'scope':'Complete synthetic VPS model only; no remote provider, SQL or installed application action','reports':reports},indent=2)+'\n')
          PY
      - name: Preserve complete source-bound model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-model-${{ matrix.php }}-${{ needs.assemble.outputs.source }}
          path: qa/remaining-prerequisites/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.assemble.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate retained shipping bytes documentation and package guards
        env:
          SOURCE: ${{ needs.assemble.outputs.source }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p qa/remaining-build
          python3 tools/integration/remaining_prerequisites.py --verify
          python3 tools/check_docs.py > qa/remaining-build/docs.log
          python3 tools/build.py --refresh > qa/remaining-build/refresh.log
          git diff --exit-code
          python3 tests/build_guards.py > qa/remaining-build/guards.log
          python3 tools/build.py --commit "$SOURCE" > qa/remaining-build/build.log
          git diff --exit-code
          printf '{"passed":true,"source":"%s","scope":"Unchanged deployed application and version; verified source build without publication"}\n' "$SOURCE" > qa/remaining-build/results.json
      - name: Preserve checks without publishing replacement ZIPs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-build-${{ needs.assemble.outputs.source }}
          path: qa/remaining-build/
          if-no-files-found: error
          retention-days: 14
