name: Revision-history model checks

on:
  pull_request:
    paths: ['foundation/revisions/**', 'tests/revisions/**', 'site/app/settings/revisions.php', 'site/admin/views/studio/history.php', '.github/workflows/revisions.yml']
  push:
    branches: [main, 'devin/non20i-*']
    paths: ['foundation/revisions/**', 'tests/revisions/**', 'site/app/settings/revisions.php', 'site/admin/views/studio/history.php', '.github/workflows/revisions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revisions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Revision checks PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and revision checks using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/revisions/*.php tests/revisions/*.php; do php -l "$source"; done
            php tests/revisions/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Isolated revision-model checks only. No persistence, permissions, admin UI or application integration is tested by this job.' >> "$GITHUB_STEP_SUMMARY"
