name: Recurring invoice lifecycle checks
on:
  push:
    branches: [main, codex/recurring-billing-lifecycle, codex/twentyi-recurring-eligibility, "devin/non20i-*"]
    paths: ['foundation/recurring-billing/**', 'tests/recurring-billing/**', 'foundation/billing-calendar/**', '.github/workflows/recurring-billing-lifecycle.yml']
  pull_request:
    paths: ['foundation/recurring-billing/**', 'tests/recurring-billing/**', 'foundation/billing-calendar/**', '.github/workflows/recurring-billing-lifecycle.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recurring-billing-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Consent and whole-period lifecycle in isolated official PHP
        run: |
          mkdir -p qa
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/workspace:ro" -v "$PWD/qa:/workspace/qa" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            php -l foundation/recurring-billing/RecurringBillingSchedule.php
            php -l tests/recurring-billing/schedule.php
            php tests/recurring-billing/schedule.php > qa/recurring-billing-lifecycle-default.json
            php -n tests/recurring-billing/schedule.php > qa/recurring-billing-lifecycle-no-ini.json
          '
      - name: Preserve named evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recurring-billing-lifecycle-${{ matrix.php }}-${{ github.sha }}
          path: qa/recurring-billing-lifecycle-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Record scope
        if: always()
        run: echo 'Pure declared consent and whole-period history eligibility. No authenticated native consent, database, invoice, scheduler, payment, service entitlement or provider acceptance.' >> "$GITHUB_STEP_SUMMARY"
