name: 20i write-boundary checks

on:
  pull_request:
    paths: ['foundation/provider/**', 'foundation/twentyi/**', 'foundation/twentyi-operations/**', 'tests/twentyi-operations/**', '.github/workflows/twentyi-operations.yml']
  push:
    branches: [main, devin/twentyi-operations, devin/twentyi-execution, devin/twentyi-reconcile, codex/twentyi-nameserver-controls, codex/twentyi-mailbox-controls, codex/twentyi-vps-controls, codex/twentyi-php-version-controls]
    paths: ['foundation/provider/**', 'foundation/twentyi/**', 'foundation/twentyi-operations/**', 'tests/twentyi-operations/**', '.github/workflows/twentyi-operations.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twentyi-operations-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  operations:
    name: 20i write boundary PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shipping mirrors and documentation
        run: |
          PYTHONPATH=tools python3 -B -c 'import build; build.generated(False)'
          python3 -B tools/check_docs.py
      - name: Build the isolated test runtime
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -f tests/twentyi/Dockerfile -t cwp-twentyi-ops:${{ matrix.php }} tests/twentyi
      - name: Synthetic write-boundary checks without external network access
        run: |
          mkdir -p "$RUNNER_TEMP/twentyi-ops-results"
          mkdir -p qa
          docker run --rm --network none -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/twentyi-ops-results:/workspace/qa" -w /workspace cwp-twentyi-ops:${{ matrix.php }} sh -ec '
            for source in foundation/provider/*.php foundation/twentyi-operations/*.php tests/twentyi-operations/*.php; do php -l "$source"; done
            php tests/twentyi-operations/run.php qa/operations-default-results.json
            php -n tests/twentyi-operations/run.php qa/operations-no-ini-results.json
            php tests/twentyi-operations/mailboxes.php qa/mailbox-default-results.json
            php -n tests/twentyi-operations/mailboxes.php qa/mailbox-no-ini-results.json
            php tests/twentyi-operations/cloud-sites.php qa/cloud-sites-default-results.json
            php -n tests/twentyi-operations/cloud-sites.php qa/cloud-sites-no-ini-results.json
            cat qa/operations-default-results.json
            cat qa/operations-no-ini-results.json
          '
      - name: Preserve named results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twentyi-operations-${{ matrix.php }}-${{ github.sha }}
          path: ${{ runner.temp }}/twentyi-ops-results/
          if-no-files-found: error
      - name: Record verification scope
        if: always()
        run: |
          echo 'Synthetic contracts, shared gateway/file-ledger mailbox replay and fixed transport admission only. Docker --network none; no real HTTP, production credential/database, native application UI or provider call. Production mailbox authority/storage/forms remain separate implementation and acceptance requirements.' >> "$GITHUB_STEP_SUMMARY"
