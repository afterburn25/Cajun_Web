name: Access policy checks

on:
  pull_request:
    paths:
      - foundation/access/**
      - tests/access/**
      - .github/workflows/access-policy.yml
  push:
    branches: [main, codex/platform-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: access-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Permission policy PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and permission decisions using the official PHP image
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "php:${{ matrix.php }}-cli" sh -ec '
            for source in foundation/access/*.php tests/access/*.php; do php -l "$source"; done
            php tests/access/run.php
          '
      - name: Record verification scope
        if: always()
        run: |
          echo 'Permission-policy unit checks only. Login, database, account lifecycle, live mail, UI, installer and 1.1.0 integration remain untested by this job.' >> "$GITHUB_STEP_SUMMARY"
