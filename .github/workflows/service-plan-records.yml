name: Service-plan storage and client agreement checks
on:
  push:
    branches: [main, codex/service-plan-records, codex/service-plan-screens]
    paths: ['site/admin/controllers/plans.php', 'site/admin/views/plans.php', 'site/portal/controllers/**', 'site/portal/views/plans.php', 'site/includes/layout/plans.php', 'site/app/plans/**', 'site/database/**', 'site/app/staff/**', 'site/app/clients/**', 'site/includes/auth/**', 'foundation/service-plans/**', 'site/includes/foundation/service-plans/**', 'tests/service_plans_native.php', '.github/workflows/service-plan-records.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-plan-records-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-settings:
    name: Service-plan records PHP ${{ matrix.php }} and MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: cwp_test
          MARIADB_USER: cwp_test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports: ['33306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CWP_TEST_DATABASE: cwp_test
      CWP_TEST_HOST: 127.0.0.1
      CWP_TEST_PORT: '33306'
      CWP_TEST_USER: cwp_test
      CWP_TEST_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare official PHP with PDO MySQL
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t cwp-service-plan-test -f tests/invitations/Dockerfile tests/invitations
      - name: Native owner plans, client consent and competing process tests
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/workspace" \
            -e CWP_TEST_DATABASE -e CWP_TEST_HOST -e CWP_TEST_PORT \
            -e CWP_TEST_USER -e CWP_TEST_PASSWORD \
            cwp-service-plan-test sh -ec '
              for source in site/app/plans/*.php site/admin/controllers/plans.php site/admin/views/plans.php site/portal/controllers/plans.php site/portal/views/plans.php site/includes/layout/plans.php site/database/schema/service_plans_schema.php site/database/migrations/service_plans_migrate.php tests/service_plans_native.php; do php -l "$source"; done
              php tests/service_plans_native.php
            '
      - name: Preserve named storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-plan-records-${{ matrix.php }}-${{ github.sha }}
          path: |
            qa/service-plans-native-results.json
          if-no-files-found: warn
          retention-days: 14
